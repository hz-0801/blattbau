<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">

<title>Runde</title>
<!-- Runde am Handy – Muster (Nachtrunde 13.11.2026, Paket P7; Konzept: aufgabenbank bau/runde-2026-11-13/p7/konzept.md).
     Aufruf: …/r/runde/?r=<Kennung>#s=<Schülernummer>  (r und s werden aus ? und # gelesen). Daten: daten/<Kennung>.json,
     erzeugt ohne Modell von aufgabenbank werkzeuge/runde.py (Form dort im Docstring); Bilder daten/<Kennung>-<nr>.svg.
     Eine Frage je Bildschirm, eigenes Zifferfeld (keine Systemtastatur), gewertet wird erst nach „Prüfen“, nach jeder Antwort
     die richtige Lösung und – bei einem benannten Fehler – ein Satz dazu. Keine Uhr, keine Rangliste, keine Punkte für Tempo.
     Eine falsch beantwortete Frage kommt, wenn die Runde einen Zwilling trägt, drei Fragen später ähnlich wieder (höchstens zwei).
     Meldung am Ende an dasselbe Formular wie r/ und r/kopf (keine neue Tabelle):
       Kennung;Schülernummer;Urteile;a=Antworten;z=Zwillinge;t=Sekunden
       Urteile  ein Zeichen je Frage der Liste nr;id (r richtig, f falsch) – so liest es aufgabenbank-privat werkzeuge/fehler.py
       a=       was getippt oder gewählt wurde, mit | getrennt (Auswahl: Platz der Option 1–4; stimmt: 1 = erster Knopf)
       z=       Zwillingsfragen als nr:r oder nr:f · t= Dauer der Runde in Sekunden (wird nicht gezeigt)
     „Fehler noch einmal“ am Ende ist Üben für den Schüler und wird nicht gemeldet. -->
<link rel="stylesheet" href="../katex/katex.min.css">
<script defer src="../katex/katex.min.js"></script>

<style>

 display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 24px 10px;padding:4px 10px}

iframe{display:none}
</style></head><body><div id="app"></div><iframe name="ziel" title="senden"></iframe>
<script>
// Briefkasten: dasselbe Google-Formular wie r/ und r/kopf.
const FORM = { url: "https://docs.google.com/forms/d/e/1FAIpQLScVAIyR0-hKCMXzbtrj8F7LXRPKd6vxw_XSq0-i5HXuzHBYUQ/formResponse", meldung: "entry.312904931" };
const MAX_ZWILLINGE = 2, ABSTAND = 3;
const q = new URLSearchParams(location.search.slice(1) + "&" + location.hash.slice(1));
const kennung = (q.get("r") || "").replace(/[^a-z0-9-]/g, "").slice(0, 24);
const snr = (q.get("s") || "").replace(/[^0-9]/g, "").slice(0, 4) || "0";
const app = document.getElementById("app");
const el = (art, klasse, text) => { const e = document.createElement(art); if (klasse) e.className = klasse; if (text != null) e.textContent = text; return e; };
const formeln = wo => { if (window.renderMathInElement) renderMathInElement(wo, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false,
  macros: { "\\sv": "\\begin{pmatrix}#1\\\\#2\\\\#3\\end{pmatrix}", "\\frac": "\\dfrac", "\\tfrac": "\\dfrac" } }); };   // Brüche groß, gut lesbar
const bildname = b => b && /^[a-z0-9-]+\.(png|svg|jpg)$/.test(b) ? b : "";
let runde, folge, i, urteile, antworten, zwillinge, zwAnzahl, beginn, nachrunde = false, gesendet = false, abgebrochen = false;
let frage, eingabe, wahl, gesperrt;

// ---- Zahlen: "−3/4", "2,5" → gekürzter Bruch [Zähler, Nenner]
const ggt = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
function bruch(t) {
  t = String(t).replace("−", "-");
  let n, d;
  if (t.includes("/")) { const [a, b] = t.split("/"); n = parseInt(a, 10); d = parseInt(b, 10); }
  else { const neg = t.startsWith("-"); const [g, k = ""] = t.replace("-", "").split(","); n = parseInt((g || "0") + k, 10) * (neg ? -1 : 1); d = Math.pow(10, k.length); }
  if (!d || isNaN(n) || isNaN(d)) return null;
  const g = ggt(n, d); return [n / g, d / g];
}
const gleich = (a, b) => { const x = bruch(a), y = bruch(b); return !!x && !!y && x[0] === y[0] && x[1] === y[1]; };
const text = () => (eingabe.minus ? "−" : "") + eingabe.z + (eingabe.bruch ? "/" + eingabe.n : "");

// ---- Bildschirme
function start(j) {
  if (!j || !Array.isArray(j.fragen) || !j.fragen.length) {
    app.replaceChildren(); const m = el("div", "mitte"); m.appendChild(el("h1", "", "Runde"));
    m.appendChild(el("p", "", kennung ? "Diese Runde ist nicht mehr online." : "Hier fehlt die Kennung der Runde (…/r/runde/?r=…).")); app.appendChild(m); return;
  }
  runde = j; document.title = j.titel || "Runde";
  app.replaceChildren(); const m = el("div", "mitte");
  m.appendChild(el("h1", "", j.titel || "Runde"));
  m.appendChild(el("p", "", j.fragen.length + " kurze Fragen."));
  m.appendChild(el("p", "", "Ohne Uhr. Nach jeder Antwort siehst du die Lösung. Fehler kosten nichts."));
  const b = el("button", "ok gross", "Los geht’s"); b.onclick = los; m.appendChild(b); app.appendChild(m);
}
function los() { folge = runde.fragen.map(f => ({ f, nr: f.nr, zw: false })); i = 0; urteile = {}; antworten = {}; zwillinge = []; zwAnzahl = 0; beginn = Date.now(); zeig(); }

function zeig() {
  const e = folge[i]; frage = e.f; gesperrt = false; wahl = null; const vorgabe = frage.art === "zahl" && !!frage.bruch && String(frage.wert || "").includes("/");   // Antwort ist ein Bruch: Feld gleich als Bruch (Lehrer 13.11.)
  eingabe = { minus: false, z: "", n: "", bruch: vorgabe, vorgabe, teil: "z" };
  app.replaceChildren();
  const kopf = el("div", "kopf"), balken = el("div", "balken");
  folge.forEach((x, k) => balken.appendChild(el("i", k < i ? "d" : k === i ? "j" : "")));
  kopf.appendChild(balken); kopf.appendChild(el("span", "", "Frage " + (i + 1) + " von " + folge.length));
  const stop = el("button", "stop", "Aufhören"); stop.onclick = aufhoeren; kopf.appendChild(stop); app.appendChild(kopf);
  if (e.zw) app.appendChild(el("div", "", "")).appendChild(el("span", "marke", "Noch einmal so eine"));
  app.appendChild(el("div", "frage", frage.frage));
  const b = bildname(frage.bild);
  if (b) { const im = el("img", "bild"); im.src = "daten/" + b; im.alt = "Bild zur Frage"; app.appendChild(im); }
  const unten = el("div", "unten"); unten.id = "unten"; app.appendChild(unten);
  if (frage.art === "zahl") zifferfeld(unten); else auswahl(unten);
  formeln(app); window.scrollTo(0, 0);
  // Bild so weit verkleinern, dass Frage, Bild und Antwortbereich ohne Scrollen auf den Bildschirm passen (mindestens 110 px)
  const im = app.querySelector(".bild");
  const passe = () => { const zuviel = document.documentElement.scrollHeight - window.innerHeight; if (im && zuviel > 0) im.style.maxHeight = Math.max(110, im.getBoundingClientRect().height - zuviel) + "px"; };
  if (im) { if (im.complete) passe(); else im.onload = passe; }
}

function zifferfeld(unten) {
  const feld = el("div", "feld"); feld.id = "feld"; feld.setAttribute("aria-label", "deine Antwort"); unten.appendChild(feld);
  const t = el("div", "tasten"); t.id = "tasten";
  const taste = (zeichen, wert, klasse, name) => { const b = el("button", klasse || "", zeichen); b.dataset.t = wert; if (name) b.setAttribute("aria-label", name); t.appendChild(b); return b; };
  ["1", "2", "3"].forEach(z => taste(z, z)); taste("⌫", "x", "", "löschen");
  ["4", "5", "6"].forEach(z => taste(z, z)); taste("−", "m", "", "Minus");
  ["7", "8", "9"].forEach(z => taste(z, z)); taste(",", "k", "", "Komma");
  if (frage.bruch) taste(eingabe.vorgabe ? "Nenner ↓" : "Bruch", "b", "klein", eingabe.vorgabe ? "zum Nenner" : "Bruchstrich"); else t.appendChild(el("span"));
  taste("0", "0"); taste("Prüfen", "ok", "ok klein breit2").id = "pruefen";
  t.onclick = ev => { const b = ev.target.closest("button"); if (b) tipp(b.dataset.t); };
  unten.appendChild(t); mal();
}
function tipp(t) {
  if (gesperrt) return;
  const e = eingabe, teil = e.bruch ? e.teil : "z";
  if (t === "ok") { if (bereit()) pruefZahl(); return; }
  if (t === "x") { if (e.bruch && e.teil === "n" && !e.n) { e.teil = "z"; if (!e.vorgabe) e.bruch = false; } else if (e[teil]) e[teil] = e[teil].slice(0, -1); else e.minus = false; }
  else if (t === "m") e.minus = !e.minus;
  else if (t === "k") { if (!e.bruch && !e.z.includes(",") && e.z.length < 7) e.z += e.z ? "," : "0,"; }
  else if (t === "b") { if (frage.bruch && e.z && !e.z.includes(",") && (!e.bruch || e.teil === "z")) { e.bruch = true; e.teil = "n"; } }
  else if (/^\d$/.test(t) && e[teil].replace(",", "").length < (e.bruch ? 4 : 7)) e[teil] += t;
  mal();
}
const bereit = () => /\d$/.test(eingabe.z) && (!eingabe.bruch || (/^\d+$/.test(eingabe.n) && +eingabe.n > 0));
function mal(klasse) {
  const feld = document.getElementById("feld"); if (!feld) return;
  feld.className = "feld " + (klasse || ""); feld.replaceChildren();
  const e = eingabe;
  if (e.bruch) {
    if (e.minus) feld.appendChild(el("span", "", "−"));
    const br = el("span", "br"); const zs = el("span", !gesperrt && e.teil === "z" ? "an" : "", e.z || " "), ns = el("span", !gesperrt && e.teil === "n" ? "an" : "", e.n || " ");
    zs.onclick = () => { if (!gesperrt) { e.teil = "z"; mal(); } }; ns.onclick = () => { if (!gesperrt && e.z) { e.teil = "n"; mal(); } };
    br.appendChild(zs); br.appendChild(el("hr")); br.appendChild(ns); feld.appendChild(br);
  } else feld.appendChild(el("span", "", (e.minus ? "−" : "") + e.z || " "));
  if (frage.masse) feld.appendChild(el("span", "mass", frage.masse));
  const p = document.getElementById("pruefen"); if (p) p.disabled = !bereit();
}
function pruefZahl() {
  const t = text(); let ok = gleich(t, frage.wert), satz = "";
  if (ok && frage.streng) {
    const soll = frage.wert.replace("−", "-"), ist = t.replace("−", "-");
    if (soll.includes("/") && !ist.includes("/")) { ok = false; satz = "Der Wert stimmt – gefragt ist aber ein Bruch."; }
    else if (soll.includes("/") && soll !== ist) { ok = false; satz = "Der Wert stimmt – der Bruch ist aber noch nicht vollständig gekürzt."; }
  }
  if (!ok && !satz && frage.fehler) for (const k in frage.fehler) if (gleich(t, k)) satz = "Typischer Fehler: " + frage.fehler[k];
  gesperrt = true; mal(ok ? "r" : "f"); document.getElementById("tasten").remove();
  fertig(ok, t, satz);
}

function auswahl(unten) {
  const zwei = frage.art === "stimmt", w = el("div", "wahl" + (zwei ? " zwei" : "")); w.id = "wahl";
  (zwei ? frage.knoepfe.map(t => ({ t })) : frage.optionen).forEach((o, k) => {
    const b = el("button"); b.setAttribute("aria-pressed", "false"); b.appendChild(el("span", "z", "")); b.appendChild(el("span", "", o.t));
    b.onclick = () => { if (gesperrt) return; wahl = k; w.querySelectorAll("button").forEach((x, n) => x.setAttribute("aria-pressed", n === k ? "true" : "false")); p.disabled = false; };
    w.appendChild(b);
  });
  unten.appendChild(w);
  const p = el("button", "ok gross", "Prüfen"); p.id = "pruefen"; p.disabled = true; p.onclick = pruefWahl; unten.appendChild(p);
}
function pruefWahl() {
  if (wahl === null || gesperrt) return; gesperrt = true;
  const zwei = frage.art === "stimmt", knoepfe = document.querySelectorAll("#wahl button");
  const richtig = zwei ? frage.knoepfe.indexOf(frage.richtig) : frage.optionen.findIndex(o => o.r), ok = wahl === richtig;
  knoepfe.forEach((b, k) => { b.disabled = true; if (k === richtig) { b.classList.add("r"); b.firstChild.textContent = "✓"; } else if (k === wahl) { b.classList.add("f"); b.firstChild.textContent = "✗"; } });
  let satz = "";
  if (!ok) { const f = zwei ? frage.fehler : frage.optionen[wahl].f; if (f) satz = "Typischer Fehler: " + f; }
  document.getElementById("pruefen").remove();
  fertig(ok, String(wahl + 1), satz);
}

function fertig(ok, antwort, satz) {
  const e = folge[i];
  if (!nachrunde) {
    if (e.zw) zwillinge.push(e.nr + ":" + (ok ? "r" : "f")); else { urteile[e.nr] = ok ? "r" : "f"; antworten[e.nr] = antwort; }
    // Zwilling: ähnliche Frage drei Plätze später, aber vor der letzten (die bleibt sicher lösbar)
    if (!ok && !e.zw && frage.zw && zwAnzahl < MAX_ZWILLINGE && i < folge.length - 1) {
      folge.splice(Math.min(i + ABSTAND, folge.length - 1), 0, { f: frage.zw, nr: e.nr, zw: true }); zwAnzahl++;
    }
  } else e.ok = ok;
  const rm = el("div", "rm " + (ok ? "r" : "f")); rm.setAttribute("role", "status");
  rm.appendChild(el("b", "", ok ? "✓ Richtig" : "✗ Noch nicht"));
  rm.appendChild(el("span", "", (ok ? "" : "Richtig ist: ") + frage.loesung));
  if (satz) rm.appendChild(el("span", "tf", satz));
  const unten = document.getElementById("unten"); unten.appendChild(rm);
  const w = el("button", "ok gross", i + 1 < folge.length ? "Weiter" : "Fertig"); w.id = "weiter";
  w.onclick = () => { i++; if (i < folge.length) zeig(); else ende(); }; unten.appendChild(w);
  formeln(rm); w.scrollIntoView({ block: "nearest" });
}

function aufhoeren() {   // Lehrer 13.11. Weg A: aufhören dürfen; gemeldet wird, was beantwortet ist, der Rest als „-"
  const unten = document.getElementById("unten"); if (!unten) return;
  unten.replaceChildren(); const k = el("div", "rueck");
  k.appendChild(el("p", "", "Wirklich aufhören? Was du schon beantwortet hast, geht an deinen Lehrer."));
  const ja = el("button", "ok gross", "Ja, aufhören"); ja.onclick = () => { abgebrochen = true; ende(); };
  const nein = el("button", "gross", "Weiter üben"); nein.onclick = () => zeig();
  k.appendChild(ja); k.appendChild(nein); unten.appendChild(k);
}
function ende() {
  const fr = runde.fragen, n = fr.length, r = fr.filter(f => urteile[f.nr] === "r").length, falsch = fr.filter(f => urteile[f.nr] === "f");
  app.replaceChildren(); const m = el("div", "mitte");
  m.appendChild(el("h1", "", abgebrochen ? "Für heute Schluss." : nachrunde ? "Für heute geschafft!" : r === n ? "Alles richtig!" : "Geschafft!"));
  m.appendChild(el("div", "zahl", r + " von " + n));
  if (abgebrochen) m.appendChild(el("p", "leise", fr.filter(f => urteile[f.nr]).length + " von " + n + " Fragen beantwortet"));
  let alt = null; try { alt = localStorage.getItem("runde-" + kennung); if (!nachrunde && !abgebrochen) localStorage.setItem("runde-" + kennung, r + " von " + n); } catch (x) {}
  if (alt && !nachrunde) m.appendChild(el("p", "leise", "Letztes Mal: " + alt));
  if (zwillinge.length && !nachrunde) { const g = zwillinge.filter(z => z.endsWith("r")).length; m.appendChild(el("p", "", "Beim zweiten Anlauf: " + g + " von " + zwillinge.length + " geschafft.")); }
  const namen = l => [...new Set(l.map(f => f.thema))].slice(0, 5);
  const liste = el("div", "liste"); let etwas = false;
  if (nachrunde) { const nochmal = folge.filter(e => !e.ok).map(e => e.f); if (nochmal.length) { liste.appendChild(el("b", "", "Das üben wir nächstes Mal:")); namen(nochmal).forEach(t => liste.appendChild(el("div", "", "· " + t))); etwas = true; }
    else { liste.appendChild(el("b", "", "Jetzt saß jede Frage einmal.")); etwas = true; } }
  else {
    if (r) { liste.appendChild(el("b", "", "Das saß:")); namen(fr.filter(f => urteile[f.nr] === "r")).forEach(t => liste.appendChild(el("div", "", "· " + t))); etwas = true; }
    if (falsch.length) { const b = el("b", "", "Das üben wir noch:"); if (r) b.style.marginTop = "8px"; liste.appendChild(b); namen(falsch).forEach(t => liste.appendChild(el("div", "", "· " + t))); etwas = true; }
  }
  if (etwas) m.appendChild(liste);
  if (!nachrunde && !abgebrochen && falsch.length) {
    const b = el("button", "ok gross", falsch.length === 1 ? "Den Fehler noch einmal" : "Die " + falsch.length + " Fehler noch einmal");
    b.onclick = () => { nachrunde = true; folge = falsch.map(f => ({ f, nr: f.nr, zw: false })); i = 0; zeig(); }; m.appendChild(b);
  }
  const status = el("p", "leise", ""); status.id = "status"; m.appendChild(status);
  m.appendChild(quellen()); app.appendChild(m); formeln(m);
  if (!gesendet) melde(status); else status.textContent = "Dein Ergebnis ist beim Lehrer.";
}
function quellen() {
  const d = el("details"); d.appendChild(el("summary", "", "Quellen der Fragen"));
  (runde.quellen || []).forEach(s => {
    const p = el("p", "", "Nr. " + s.nr.join(", ") + ": " + s.quelle + (s.namensnennung ? " (" + s.namensnennung + ")" : "") + (s.lizenz ? ", " + s.bearbeitung + ", Lizenz " : ""));
    if (s.lizenz) { if (s.lizenz_url) { const a = el("a", "", s.lizenz); a.href = s.lizenz_url; a.rel = "noopener"; p.appendChild(a); } else p.appendChild(document.createTextNode(s.lizenz));
      p.appendChild(document.createTextNode(". " + (s.hinweis || "") + (s.url && s.url.length ? " Fundstelle: " + s.url.join(", ") : ""))); }
    d.appendChild(p);
  });
  return d;
}
function melde(status) {   // eine Zeile an die Rückkanal-Tabelle; die Antwort von Google lädt in den unsichtbaren Rahmen
  const sauber = t => String(t == null ? "-" : t).replace(/[;|=\s]/g, "");
  const fr = runde.fragen, wert = [kennung, snr, fr.map(f => urteile[f.nr] || "-").join(""), "a=" + fr.map(f => sauber(antworten[f.nr])).join("|"),
    "z=" + zwillinge.join(","), "t=" + Math.round((Date.now() - beginn) / 1000)].join(";");
  window.letzteMeldung = wert;
  try {
    const f = el("form"); f.method = "POST"; f.action = FORM.url; f.target = "ziel"; f.style.display = "none";
    const e = el("input"); e.type = "hidden"; e.name = FORM.meldung; e.value = wert; f.appendChild(e);
    const rahmen = document.querySelector("iframe"); let da = false;
    rahmen.addEventListener("load", () => { da = true; gesendet = true; const s = document.getElementById("status"); if (s) s.textContent = "Dein Ergebnis ist beim Lehrer."; }, { once: true });
    setTimeout(() => { const s = document.getElementById("status"); if (!da && s) { s.textContent = "Das Senden hat nicht geklappt. Hast du Netz? "; const b = el("button", "klein", "Noch einmal senden"); b.style.padding = "0 14px"; b.onclick = () => { s.textContent = "Sende …"; melde(s); }; s.appendChild(b); } }, 10000);
    document.body.appendChild(f); f.submit(); f.remove(); status.textContent = "Sende …";
  } catch (x) { status.textContent = "Das Senden hat nicht geklappt."; }
}
// echte Tastatur darf zusätzlich (Ziffern, Komma, Punkt als Komma, Minus, / als Bruch, Rücktaste, Enter)
document.addEventListener("keydown", ev => {
  if (!frage || gesperrt) { if (ev.key === "Enter") { const w = document.getElementById("weiter"); if (w) w.click(); } return; }
  if (frage.art !== "zahl") { if (ev.key === "Enter") pruefWahl(); return; }
  const k = ev.key; tipp(/^\d$/.test(k) ? k : k === "," || k === "." ? "k" : k === "-" ? "m" : k === "/" ? "b" : k === "Backspace" ? "x" : k === "Enter" ? "ok" : "");
});
window.addEventListener("load", () => {
  if (!kennung) return start(null);
  fetch("daten/" + kennung + ".json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(start).catch(() => start(null));
});
