<!-- Runde am Handy – Muster (Nachtrunde 13.11.2026, Paket P7; Konzept: aufgabenbank bau/runde-2026-11-13/p7/konzept.md).
     Aufruf: …/r/runde/?r=<Kennung>#s=<Schülernummer>  (r und s werden aus ? und # gelesen). Daten: daten/<Kennung>.json,
     erzeugt ohne Modell von aufgabenbank werkzeuge/runde.py (Form dort im Docstring); Bilder daten/<Kennung>-<nr>.svg.
     Eine Frage je Bildschirm, eigenes Zifferfeld (keine Systemtastatur), gewertet wird erst nach „Prüfen“, nach jeder Antwort
     die richtige Lösung und – bei einem benannten Fehler – ein Satz dazu. Keine Uhr, keine Rangliste, keine Punkte für Tempo.
     Eine falsch beantwortete Frage kommt, wenn die Runde einen Zwilling trägt, drei Fragen später ähnlich wieder (höchstens zwei).
     Meldung am Ende an dasselbe Formular wie r/ und r/kopf (keine neue Tabelle):
       Kennung;Schülernummer;Urteile;a=Antworten;z=Zwillinge;t=Sekunden
       Urteile  ein Zeichen je Frage der Liste nr;id (r richtig, f falsch) – so liest es aufgabenbank-privat werkzeuge/fehler.py
       a=       was getippt oder gewählt wurde, mit | getrennt (Auswahl: Platz der Option 1–4; stimmt: 1 = erster Knopf)
       z=       Zwillingsfragen als nr:r oder nr:f · t= Dauer der Runde in Sekunden (wird nicht gezeigt)
       f=       nur bei mehreren Fassungen (runde.py --fassungen): welche Fassung lief; Urteile gelten deren Zeilen der Liste
                fassung;nr;id. Je Gerät die nächste Fassung (localStorage), die erste zufällig.
     „Fehler noch einmal“ am Ende ist Üben für den Schüler und wird nicht gemeldet.
     W82 (Lehrer 21.11.: „ganz deutlich … richtig oder falsch. Also vielleicht den Bildschirm für eine Sekunde grün oder für eine Sekunde rot“;
     Lösungen „nur, wenn man möchte“): nach „Prüfen“ blitzt der ganze Bildschirm eine Sekunde grün mit ✓ oder rot mit ✗ (✗ wackelt, damit es
     nicht nur an der Farbe hängt; am Handy kurz Vibration bei falsch); bei falsch zeigt erst „Lösung zeigen“ die richtige Lösung.
     W84 (L 22.11., Paket A; Befunde 25–28): kein „Prüfen“ bei Zahlen – hat die Eingabe die Länge der richtigen Antwort oder ruht sie
     3 s, füllt sich ein Ring 1,5 s, dann wird gewertet; jeder Tastendruck setzt ihn zurück; Enter wertet sofort. Der Ring läuft auch
     bei richtig, damit „springt sofort“ nichts verrät. „Bist du sicher?“ nur bei Beinahe-Fehlern (Vorzeichen, um 1 daneben, Ziffern
     vertauscht), höchstens einmal je Frage und höchstens jede dritte Frage; gemeldet als h=<nr,…> (Urteil r/f bleibt). Leiste grün/rot
     je Frage; „Rechne $…$.“ → Aufforderung oben, Ausdruck groß in der Mitte; nach falsch nur Frage – deine Antwort – richtig
     („5 · 0 = 0“), Rechenweg nur auf Knopf, der Satz zum typischen Fehler nicht für den Schüler (bleibt in den Daten). -->

<script>
// \sv{a}{b} oder \sv{a}{b}{c}: Spaltenvektor mit zwei oder drei Komponenten (Werkstatt 29; vorher nur drei – zwei Komponenten erschienen falsch)

const MAX_ZWILLINGE = 2, ABSTAND = 3;
const q = new URLSearchParams(location.search.slice(1) + "&" + location.hash.slice(1));
const kennung = (q.get("r") || "").replace(/[^a-z0-9-]/g, "").slice(0, 24);
const snr = (q.get("s") || "").replace(/[^0-9]/g, "").slice(0, 4) || "0";
const app = document.getElementById("app");
const el = (art, klasse, text) => { const e = document.createElement(art); if (klasse) e.className = klasse; if (text != null) e.textContent = text; return e; };
const formeln = wo => { if (window.renderMathInElement) renderMathInElement(wo, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false,
  macros: { "\\sv": SV, "\\frac": "\\dfrac", "\\tfrac": "\\dfrac" } }); };   // Brüche groß, gut lesbar
const bildname = b => b && /^[a-z0-9-]+\.(png|svg|jpg)$/.test(b) ? b : "";
let fassung = 0, runde, folge, i, urteile, antworten, zwillinge, zwAnzahl, beginn, nachrunde = false, gesendet = false, abgebrochen = false;
let frage, eingabe, wahl, gesperrt, teile, uhr = null, ruhe = null, hinweisHier = false, letzterHinweis = -99, hinweise = [];

// ---- Zahlen: "−3/4", "2,5" → gekürzter Bruch [Zähler, Nenner]
const ggt = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
function bruch(t) {

  let n, d;
  if (t.includes("/")) { const [a, b] = t.split("/"); n = parseInt(a, 10); d = parseInt(b, 10); }
  else { const neg = t.startsWith("-"); const [g, k = ""] = t.replace("-", "").split(","); n = parseInt((g || "0") + k, 10) * (neg ? -1 : 1); d = Math.pow(10, k.length); }
  if (!d || isNaN(n) || isNaN(d)) return null;
  const g = ggt(n, d); return [n / g, d / g];
}
const gleich = (a, b) => { const x = bruch(a), y = bruch(b); return !!x && !!y && x[0] === y[0] && x[1] === y[1]; };

function trenne(t) { const m = /^([A-ZÄÖÜ][^$:]{0,40}?)\s*:?\s*\$([^$]+)\$\s*\.?$/.exec(String(t || "")); return m ? { auf: m[1], aus: m[2] } : null; }
const tex = w => { w = String(w).replace("−", "-"); if (w.includes("/")) { const [a, b] = w.split("/"); const neg = a.startsWith("-"); return (neg ? "-" : "") + "\\frac{" + a.replace("-", "") + "}{" + b + "}"; } return w.replace(",", "{,}"); };
const norm = w => String(w).replace(/−/g, "-").replace(/\s/g, "");
const text = () => (eingabe.minus ? "−" : "") + eingabe.z + (eingabe.bruch ? "/" + eingabe.n : "");

// ---- Bildschirme
function start(j) {
  if (!j || !Array.isArray(j.fragen) || !j.fragen.length) {
    app.replaceChildren(); const m = el("div", "mitte"); m.appendChild(el("h1", "", "Runde"));
    m.appendChild(el("p", "", kennung ? "Diese Runde ist nicht mehr online." : "Hier fehlt die Kennung der Runde (…/r/runde/?r=…).")); app.appendChild(m); return;
  }

  if (Array.isArray(j.fassungen) && j.fassungen.length > 1) {   // drei Fassungen (runde.py --fassungen): je Gerät die nächste, die erste zufällig
    let alt = 0; try { alt = parseInt(localStorage.getItem("runde-f-" + kennung) || "0", 10) || 0; } catch (x) {}

  }

  // Register 21.11.14 (Lehrer 21.11. W83 „was ist für den Schüler wichtig?“): am Start nur, was ihn etwas tun lässt – Thema ohne
  // Niveauwort, Umfang, ein Satz, der Raten erlaubt, Start. Lösung zeigen, Uhr, Aufhören erfährt er, wenn es soweit ist.
  // Keine Wahl der Länge (Lehrer 21.11.: „die meisten werden 8 nehmen“; Claude entschied: keine). Schwerer am Ende ab 90 %: Muster offen.
  m.appendChild(el("h1", "", thema(j.titel)));
  m.appendChild(el("p", "", j.fragen.length + " Fragen. Fehler kosten nichts."));
  const b = el("button", "ok gross", "Los geht’s"); b.onclick = los; m.appendChild(b);
  app.appendChild(m);

// Thema ohne Niveauwort (wie der Blattkopf, Paket Montag 21.11.): „Blitzrunde leicht: Vorzeichen, Null“ → „Vorzeichen, Null“
function thema(t) {
  const roh = String(t || "").trim();
  const s = roh.replace(/^(Blitzrunde|Runde)\s*(ganz\s+)?(leicht|mittel|schwer)?\s*:\s*/i, "")

function los() { if (fassung) try { localStorage.setItem("runde-f-" + kennung, String(fassung)); } catch (x) {}
  folge = runde.fragen.map(f => ({ f, nr: f.nr, zw: false })); i = 0; letzterHinweis = -99; hinweise = []; urteile = {}; antworten = {}; zwillinge = []; zwAnzahl = 0; beginn = Date.now(); zeig(); }

function zeig() {
  const e = folge[i]; frage = e.f; gesperrt = false; wahl = null; hinweisHier = false; stoppe(); const vorgabe = frage.art === "zahl" && !!frage.bruch && String(frage.wert || "").includes("/");   // Antwort ist ein Bruch: Feld gleich als Bruch (Lehrer 13.11.)
  eingabe = { minus: false, z: "", n: "", bruch: vorgabe, vorgabe, teil: "z" };
  app.replaceChildren();
  const kopf = el("div", "kopf"), balken = el("div", "balken");
  folge.forEach((x, k) => balken.appendChild(el("i", k < i ? (x.ok === undefined ? "d" : x.ok ? "r" : "f") : k === i ? "j" : "")));   // Befund 25
  kopf.appendChild(balken); kopf.appendChild(el("span", "", "Frage " + (i + 1) + " von " + folge.length));
  const stop = el("button", "stop", "Aufhören"); stop.onclick = aufhoeren; kopf.appendChild(stop); app.appendChild(kopf);
  if (e.zw) app.appendChild(el("div", "", "")).appendChild(el("span", "marke", "Noch einmal so eine"));
  const b = bildname(frage.bild);
  teile = b ? null : trenne(frage.frage);
  if (teile) { app.appendChild(el("div", "auff", teile.auf)); app.appendChild(el("div", "ausdr", "$" + teile.aus + "$")); }
  else app.appendChild(el("div", "frage", frage.frage));
  if (b) { const im = el("img", "bild"); im.src = "daten/" + b; im.alt = "Bild zur Frage"; app.appendChild(im); }
  const unten = el("div", "unten"); unten.id = "unten"; app.appendChild(unten);
  if (frage.art === "zahl") zifferfeld(unten); else auswahl(unten);

function zifferfeld(unten) {

  const t = el("div", "tasten"); t.id = "tasten";

  if (frage.bruch) taste(eingabe.vorgabe ? "Nenner ↓" : "Bruch", "b", "klein", eingabe.vorgabe ? "zum Nenner" : "Bruchstrich"); else t.appendChild(el("span"));
  taste("0", "0", "breit2"); t.appendChild(el("span"));
  t.onclick = ev => { const b = ev.target.closest("button"); if (b) tipp(b.dataset.t); };
  unten.appendChild(t); mal();
}
function tipp(t) {
  if (gesperrt) return;
  const e = eingabe, teil = e.bruch ? e.teil : "z";
  if (t === "ok") { weg(); abschluss(); return; }
  if (t === "x") { if (e.bruch && e.teil === "n" && !e.n) { e.teil = "z"; if (!e.vorgabe) e.bruch = false; } else if (e[teil]) e[teil] = e[teil].slice(0, -1); else e.minus = false; }
  else if (t === "m") e.minus = !e.minus;

  else if (/^\d$/.test(t) && e[teil].replace(",", "").length < (e.bruch ? 4 : 7)) e[teil] += t;

}
// Ring (Paket A, L 22.11.): Länge der richtigen Antwort erreicht → sofort; sonst nach 3 s Ruhe. 1,5 s Ring, dann gewertet.
function stoppe() { clearTimeout(uhr); clearTimeout(ruhe); uhr = ruhe = null; const r = document.getElementById("ring"); if (r) r.classList.remove("an"); }
function plane() {
  stoppe(); if (gesperrt || !bereit() || document.getElementById("sicher")) return;
  if (norm(text()).length === norm(frage.wert).length) ring(); else ruhe = setTimeout(ring, 3000);
}
function ring() { clearTimeout(uhr); const r = document.getElementById("ring"); if (!r) return; r.classList.remove("an"); void r.getBoundingClientRect(); r.classList.add("an"); uhr = setTimeout(() => { stoppe(); abschluss(); }, 1500); }
function weg() { const s = document.getElementById("sicher"); if (s) s.remove(); }
// Beinahe-Fehler: Vorzeichen, um 1 daneben (ganze Zahlen ab 3), Ziffern vertauscht
function nahe(t, w) {
  const x = bruch(t), y = bruch(w); if (!x || !y || x[1] !== y[1] || x[0] === y[0]) return false;
  if (y[0] !== 0 && x[0] === -y[0]) return true;
  if (y[1] === 1 && Math.abs(y[0]) >= 3 && Math.abs(x[0] - y[0]) === 1) return true;

}
function abschluss() {
  if (gesperrt || !bereit()) return; stoppe();
