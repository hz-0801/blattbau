<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Lösungen</title>
<!-- Rückmeldeseite (mathe-nachhilfe plan.md Register 09.11.14, 10.11.8, 10.11.11–13). Aufruf: …/r/#t=<Kennung>&s=<Schülernummer>.
     Daten t/<Kennung>.json, zwei Formen:
       {"titel", "l": [[Ergebnis, Ansatz, Bild?], …]}                      5-Minuten-Test, Basiszettel, Blätter bis 10.11.: Urteil je Zeile
       {"titel", "p": [[nr, teil, Ergebnis, Weg, Urteil?], …], "b": {nr: Bild}, "pdf": Datei}
                                                                             Übungsblatt: Ergebnis und Weg je Teilaufgabe, Urteil nur wo Urteil = 1
     Beide dürfen "bis" tragen (Tag, an dem aufgabenbank werkzeuge/qr-aufraeumen.py die Datei löscht).
     Meldung an das Formular: Kennung;Schülernummer;ein Zeichen je Urteil-Stelle (r richtig, f falsch, u nicht verstanden, - frei). -->
<style>
  :root { --fg:#111; --grau:#666; --linie:#ccc; --ja:#1a7f37; --nein:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--fg); background:#fff; max-width:34rem; margin-inline:auto; }
  h1 { font-size:1.2rem; margin:0 0 .6rem; }
  .a { display:grid; grid-template-columns:1.9rem 1fr; padding:.45rem 0; border-top:1px solid var(--linie); }
  .n { font-weight:700; padding-top:.5rem; }
  .a > img { grid-column:2; display:block; max-width:min(100%,16rem); margin:.2rem 0; }
  /* Ergebnis und Knöpfe nebeneinander; passt das Ergebnis nicht daneben, rutschen die Knöpfe darunter (nie in die Formel). */
  .t { display:flex; flex-wrap:wrap; column-gap:.5rem; row-gap:.25rem; align-items:center; padding:.2rem 0; min-height:2.5rem; }
  .e { flex:1 1 auto; max-width:100%; }
  .e small { display:block; color:var(--grau); }
  .katex { white-space:nowrap; }
  .wk { display:inline-block; margin-left:.4rem; padding:.05rem .5rem; font-size:.85rem; color:var(--grau); background:#f2f2f2; border:1px solid var(--linie); border-radius:999px; white-space:nowrap; }
  .w { display:none; flex:1 1 100%; font-size:.95rem; margin:.25rem 0 .2rem; padding:.3rem .6rem; background:#f6f6f6; border-radius:6px; overflow-x:auto; }
  .w.auf { display:block; } .w .katex { white-space:normal; }
  .k { display:flex; gap:.3rem; margin-left:auto; }
  .k button { width:2.5rem; height:2.5rem; font-size:1.15rem; font-weight:700; background:#fff; border:1.5px solid; border-radius:6px; }
  .k .r { color:var(--ja); } .k .f { color:var(--nein); } .k .u { color:var(--grau); }
  .k .r[aria-pressed="true"] { background:var(--ja); border-color:var(--ja); color:#fff; }
  .k .f[aria-pressed="true"] { background:var(--nein); border-color:var(--nein); color:#fff; }
  .k .u[aria-pressed="true"] { background:var(--grau); border-color:var(--grau); color:#fff; }
  #ab { display:none; width:100%; margin:1rem 0 .5rem; padding:.9rem; font-size:1.1rem; font-weight:700; border:0; border-radius:8px; background:var(--fg); color:#fff; }
  #ab:disabled { background:#999; }
  #m { min-height:1.5rem; color:var(--grau); }
  #pdf { display:none; margin:.8rem 0 0; }
  iframe { display:none; }
  #nr { display:none; margin:0 0 .8rem; }
  #nr input { width:5rem; font-size:1.1rem; padding:.4rem; border:1.5px solid var(--fg); border-radius:6px; }
  @media print {
    body { max-width:none; padding:0; font-size:11pt; }
    .k, .wk, #ab, #m, #nr, #pdf { display:none !important; }
    .a { break-inside:avoid; } .w { display:block; background:none; padding:0; color:#333; }
  }
</style>
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/auto-render.min.js"></script>
</head>
<body>
<h1 id="kopf">Lösungen</h1>
<p id="nr"><label>Deine Nummer: <input id="snr" inputmode="numeric" maxlength="4" autocomplete="off"></label></p>
<div id="liste"></div>
<button id="ab" disabled>Absenden</button>
<p id="m"></p>
<p id="pdf"><a id="pdfa" href="#">Blatt mit Lösungen speichern (PDF)</a></p>
<iframe name="ziel" title="senden"></iframe>
<iframe name="auf" title="geöffnet"></iframe>
<script>
// Briefkasten: ein Google-Formular für alle Blätter (Test und Nummer stehen hinter #, damit sie nicht an den Seitenserver gehen).
const FORM = { url: "https://docs.google.com/forms/d/e/1FAIpQLScVAIyR0-hKCMXzbtrj8F7LXRPKd6vxw_XSq0-i5HXuzHBYUQ/formResponse", meldung: "entry.312904931" };
// Probe vom 09.11. (Einheitskreis, Kl. 10) – der erste ausgegebene QR-Code zeigt hierher.
const PROBE = { "ek10": { titel: "", l: [
  ["1", ""], ["gegen den Uhrzeigersinn", "Start an der positiven x-Achse"], ["(0 | 1)", ""], ["180°", ""],
  ["x = cos α, y = sin α", ""], ["auf der x-Achse", ""], ["sin α = 0,8 und cos α = 0,6", "sin ist die y-, cos die x-Koordinate"],
  ["(0 | −1)", ""], ["die senkrechte", "sie ist die y-Koordinate"],
  ["Kein Punkt des Kreises liegt höher als 1.", "sin = Höhe des Punktes, Radius 1"] ] } };
const q = new URLSearchParams(location.hash.slice(1));
const t = (q.get("t") || "ek10").replace(/[^a-z0-9-]/g, "").slice(0, 24);
const s = (q.get("s") || "").replace(/[^0-9]/g, "").slice(0, 4);
const liste = document.getElementById("liste"), ab = document.getElementById("ab"), m = document.getElementById("m");
const el = (art, klasse, text) => { const e = document.createElement(art); if (klasse) e.className = klasse; if (text != null) e.textContent = text; return e; };
const bildname = b => b && /^[a-z0-9-]+\.(png|svg|jpg)$/.test(b) ? b : "";
const start = j => {
  if (!j || !(j.l || j.p)) { m.textContent = "Die Lösungen zu diesem Blatt sind nicht mehr online."; return; }
  // Beide Datenformen auf eine Zeilenform bringen: Nummer, Teil, Ergebnis, kleiner Zusatz, Weg zum Aufklappen, Bild, Urteil ja/nein.
  const zeilen = j.l ? j.l.map(([erg, an, bild], i) => ({ nr: i + 1, teil: "", erg, klein: an, weg: "", bild: bildname(bild), urteil: true }))
                     : j.p.map(([nr, teil, erg, weg, urteil]) => ({ nr, teil, erg, klein: "", weg, bild: bildname(j.b && j.b[nr]), urteil: !!urteil }));
  const stellen = zeilen.filter(z => z.urteil);   // nur diese gehen in die Meldung
  const wahl = stellen.map(() => ""); let offenGefragt = false;
  if (j.titel) document.getElementById("kopf").textContent = "Lösungen · " + j.titel;
  // Geöffnet zählt als vorgelegt (Lehrer 11.11.): eine Meldung "Kennung;Nummer;auf" beim Laden, höchstens einmal je Gerät und Blatt.
  try { const merk = "auf-" + t + "-" + s;
    if (!PROBE[t] && !localStorage.getItem(merk)) { const f = el("form"); f.method = "POST"; f.action = FORM.url; f.target = "auf"; f.style.display = "none";
      const e = el("input"); e.type = "hidden"; e.name = FORM.meldung; e.value = [t, s || "0", "auf"].join(";"); f.appendChild(e);
      document.body.appendChild(f); f.submit(); localStorage.setItem(merk, "1"); } } catch (x) {}
  if (stellen.length) { ab.style.display = "block"; if (!s) document.getElementById("nr").style.display = "block"; }
  let block = null, letzte = null;
  zeilen.forEach(z => {
    if (z.nr !== letzte) {
      block = el("div", "a"); block.appendChild(el("div", "n", z.nr)); block.appendChild(el("div", "ts")); liste.appendChild(block); letzte = z.nr;
      if (z.bild) { const b = el("img"); b.src = "t/" + z.bild; b.alt = "Lösung zu Aufgabe " + z.nr; block.appendChild(b); }
    }
    const zeile = el("div", "t"), e = el("div", "e", (z.teil ? z.teil + ") " : "") + z.erg);
    if (z.klein) e.appendChild(el("small", "", z.klein));
    let w = null;
    if (z.weg) { const wk = el("button", "wk", "▸ Weg"); wk.type = "button"; w = el("div", "w", z.weg);
      wk.onclick = () => { wk.textContent = w.classList.toggle("auf") ? "▾ Weg" : "▸ Weg"; }; e.appendChild(wk); }
    zeile.appendChild(e);
    if (z.urteil) {
      const i = stellen.indexOf(z), k = el("div", "k");
      [["r", "✓", "richtig"], ["f", "✗", "falsch"], ["u", "?", "nicht verstanden"]].forEach(([c, zeichen, name]) => {
        const b = el("button", c, zeichen); b.type = "button"; b.setAttribute("aria-label", z.nr + (z.teil ? " " + z.teil : "") + " " + name); b.setAttribute("aria-pressed", "false");
        // Noch einmal antippen nimmt die Wahl zurück; gesendet werden darf ab einer gewählten Zeile (Lehrer 10.11.).
        b.onclick = () => { wahl[i] = wahl[i] === c ? "" : c; k.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b && wahl[i] ? "true" : "false"));
          ab.disabled = !wahl.some(Boolean); offenGefragt = false; ab.textContent = "Absenden"; m.textContent = ""; };
        k.appendChild(b);
      });
      zeile.appendChild(k);
    }
    if (w) zeile.appendChild(w);
    block.querySelector(".ts").appendChild(zeile);
  });
  if (window.renderMathInElement) renderMathInElement(liste, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false });
  if (j.pdf && /^[a-z0-9-]+\.pdf$/.test(j.pdf)) { document.getElementById("pdfa").href = "t/" + j.pdf; document.getElementById("pdf").style.display = "block"; }
  ab.onclick = () => {
    const offen = wahl.filter(x => !x).length;
    if (offen && !offenGefragt) { offenGefragt = true; ab.textContent = "Trotzdem senden"; m.textContent = offen + (offen === 1 ? " Zeile" : " Zeilen") + " ohne Angabe – sie zählen als nicht bearbeitet."; return; }
    const f = el("form"); f.method = "POST"; f.action = FORM.url; f.target = "ziel";
    const e = el("input"); e.type = "hidden"; e.name = FORM.meldung;
    e.value = [t, s || document.getElementById("snr").value.replace(/[^0-9]/g, "").slice(0, 4) || "0", wahl.map(x => x || "-").join("")].join(";"); f.appendChild(e);
    // Die Antwort von Google lädt in den unsichtbaren Rahmen; erst dann gilt es als gesendet.
    const rahmen = document.querySelector("iframe"); let fertig = false;
    rahmen.addEventListener("load", () => { fertig = true; ab.textContent = "Gesendet"; m.textContent = "Danke – du kannst die Seite schließen."; }, { once: true });
    setTimeout(() => { if (!fertig) { ab.disabled = false; ab.textContent = "Noch einmal senden"; m.textContent = "Das Senden hat nicht geklappt. Hast du Netz?"; } }, 10000);
    document.body.appendChild(f); f.submit(); ab.disabled = true; ab.textContent = "Sende …";
  };
};
window.addEventListener("load", () => {
  if (PROBE[t]) return start(PROBE[t]);
  fetch("t/" + t + ".json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(start).catch(() => start(null));
});
</script>
</body>
</html>
