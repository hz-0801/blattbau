<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scheitelpunktform: a, d und e ablesen</title>
<!-- a, d und e aus der Scheitelpunktform ablesen – Übung am Handy (Bestell-Chat 17.11.2026, Lehrerwort: „3 mal Klammer auf
     x minus 4 Klammer zu zum Quadrat plus 5. Ich möchte, dass Erik abliest, was a, d und e ist“). Kein Graph – die Fassung mit
     Graph liegt unter ../parabel-graph/. Schreibweise der Schule: f(x) = a(x + d)² + e, also d = −4 bei (x − 4)².
     Fassung 2 (Lehrer 17.11.: „nicht gut dargestellt … f(x) = x² ohne zu wissen, um was es geht“): Scheitelpunktform steht groß und
     farbig über der Funktion, die Felder tragen dieselben Farben, nach dem Prüfen steht die Funktion ausgeschrieben da.
     Eine Gleichung je Bildschirm, drei Felder, eigenes Zifferfeld. Erst der volle Fall, dann die Sonderfälle: kein a (a = 1),
     nur Minus (a = −1), keine Klammer (d = 0), kein e (e = 0), Kommazahl, e vorn. Keine Uhr, keine Meldung, keine Namen. -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f7fb;color:#18324a}
body{display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
h1{font-size:1.05rem;margin:2px 2px 4px;font-weight:650}
.intro{font-size:.95rem;margin:0 2px 10px;color:#3d566c}
.zeile{display:grid;grid-template-columns:1fr;gap:2px;text-align:center;padding:8px 0 4px}
.zeile small{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:#5b7389}
.form{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.55rem;white-space:nowrap}
.trenn{border:0;border-top:1px dashed #c5d5e4;margin:6px 0 2px}
.ca{color:#b5471f}.cd{color:#1f6fb2}.ce{color:#2a7d4f}
.voll{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.25rem;text-align:center;white-space:nowrap;margin:8px 0 0;display:none}
.voll.da{display:block}
.voll small{display:block;font-family:system-ui,sans-serif;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:#5b7389}
.karte{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(24,50,74,.12);padding:14px}
.gl{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.85rem;white-space:nowrap}
.gl i,.form i,.voll i{font-style:italic}.gl sup,.form sup,.voll sup{font-size:.62em}
.felder{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feld{border:2px solid #c5d5e4;border-radius:12px;background:#fff;padding:8px 6px 10px;text-align:center;font:inherit;color:inherit}
.feld .n{display:block;font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-size:1.2rem;font-weight:bold}
.feld .w{display:block;font-size:1.5rem;min-height:2rem;font-variant-numeric:tabular-nums}
.feld[aria-pressed=true]{border-color:#1f6fb2;box-shadow:0 0 0 3px rgba(31,111,178,.18)}
.feld.r{border-color:#2a9d6a;background:#e3f5ec}.feld.f{border-color:#d9695d;background:#fdecea}
.tasten{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tasten button{height:50px;border:1.5px solid #c5d5e4;background:#fff;border-radius:10px;font:inherit;font-size:1.3rem;color:#18324a}
.tasten button:active{background:#e6eef6}
.haupt{width:100%;margin-top:12px;height:52px;border:0;border-radius:12px;background:#1f6fb2;color:#fff;font:inherit;font-size:1.08rem;font-weight:600}
.haupt:active{background:#195c94}
.meld{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.45;display:none}
.meld.r{display:block;background:#e3f5ec;color:#14533a}.meld.f{display:block;background:#fdecea;color:#7a2a22}
.fuss{display:flex;justify-content:space-between;font-size:.82rem;color:#5b7389;margin:12px 2px 0}
.punkte{display:flex;gap:4px;align-items:center}
.punkte span{width:10px;height:10px;border-radius:50%;background:#d5e0ea}
.punkte span.r{background:#2a9d6a}.punkte span.f{background:#d9695d}
:focus-visible{outline:3px solid #f0a202;outline-offset:2px}
</style></head>
<body><main>
<h1>Scheitelpunktform: a, d und e ablesen</h1>
<p class="intro">Vergleiche deine Funktion mit der Scheitelpunktform. Welche Zahlen stehen für <i>a</i>, <i>d</i> und <i>e</i>?</p>
<div class="karte">
  <div class="zeile"><small>Scheitelpunktform</small><div class="form"><i>f</i>(<i>x</i>) = <b class="ca"><i>a</i></b>(<i>x</i> + <b class="cd"><i>d</i></b>)<sup>2</sup> + <b class="ce"><i>e</i></b></div></div>
  <hr class="trenn">
  <div class="zeile"><small>Deine Funktion</small><div class="gl" id="gl" aria-live="polite"></div></div>
  <div class="voll" id="voll"></div>
  <div style="height:10px"></div>
  <div class="felder" id="felder"></div>
  <div class="tasten" id="tasten"></div>
  <button class="haupt" id="haupt">Prüfen</button>
  <div class="meld" id="meld" role="status"></div>
  <div class="fuss"><div class="punkte" id="punkte" aria-hidden="true"></div><div id="stand"></div></div>
</div>
</main>
<script>
(function(){
"use strict";
var N=10, soll, ein={a:"",d:"",e:""}, aktiv="a", geprueft=false, verlauf=[], nr=0, vorher="";
function zuf(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function wahl(l){return l[zuf(0,l.length-1)]}
function ohne0(a,b){var v;do{v=zuf(a,b)}while(v===0);return v}
// Folge einer Runde: erst der volle Fall, dann jede Sonderform einmal, am Ende gemischt
var FOLGE=["voll","voll","dplus","ohnea","minus","ohned","ohnee","komma","evorn","mix"];
function neu(){
  var art=FOLGE[nr%N], p, i=0;
  if(art==="mix") art=wahl(["ohnea","minus","ohned","ohnee","komma","evorn","nur","voll"]);
  do{
    p={a:wahl([2,3,4,5,-2,-3,-4]),d:-zuf(1,9),e:zuf(1,9),vorn:false};          // voll: a(x − …)² + …
    if(art==="dplus"){p.d=zuf(1,9);p.e=-zuf(1,9);}
    if(art==="ohnea"){p.a=1;p.d=ohne0(-9,9);p.e=ohne0(-9,9);}
    if(art==="minus"){p.a=-1;p.d=ohne0(-9,9);p.e=ohne0(-9,9);}
    if(art==="ohned"){p.a=wahl([1,-1,2,3,-2,0.5]);p.d=0;p.e=ohne0(-9,9);}
    if(art==="ohnee"){p.a=wahl([1,-1,2,-3,4]);p.d=ohne0(-9,9);p.e=0;}
    if(art==="komma"){p.a=wahl([0.5,-0.5,1.5,0.25,-2.5]);p.d=wahl([-2.5,1.5,-0.5,3,-4]);p.e=wahl([-1.5,2.5,0.5,-3]);}
    if(art==="evorn"){p.a=wahl([1,2,-1,-2,3]);p.d=ohne0(-9,9);p.e=zuf(1,9);p.vorn=true;}
    if(art==="nur"){p.a=wahl([1,-1,3,-0.5]);p.d=0;p.e=0;}
    if(Math.random()<.5 && (art==="ohnea"||art==="minus"||art==="voll")) {}
    i++;
  }while(JSON.stringify(p)===vorher && i<20);
  vorher=JSON.stringify(p); soll=p; ein={a:"",d:"",e:""}; aktiv="a"; geprueft=false;
  document.getElementById("gl").innerHTML=gl(p);
  var m=document.getElementById("meld"); m.className="meld"; m.innerHTML="";
  document.getElementById("voll").className="voll";
  document.getElementById("haupt").textContent="Prüfen";
  felder(); stand();
}
function de(v){return String(Math.abs(v)).replace(".",",")}
function mz(v){return String(v).replace(".",",").replace("-","−")}
function gl(p){
  var vor=(p.a<0?"−":"")+(Math.abs(p.a)===1?"":de(p.a));
  var kern=p.d===0?'<i>x</i><sup>2</sup>':'(<i>x</i> '+(p.d>0?"+":"−")+' '+de(p.d)+')<sup>2</sup>';
  var s='<i>f</i>(<i>x</i>) = ';
  if(p.vorn){ s+=de(p.e)+' '+(p.a<0?"−":"+")+' '+(Math.abs(p.a)===1?"":de(p.a))+kern; }
  else { s+=vor+kern; if(p.e!==0) s+=' '+(p.e>0?"+":"−")+' '+de(p.e); }
  return s;
}
function voll(){
  function w(v){return v<0?"(−"+de(v)+")":de(v)}
  return '<i>f</i>(<i>x</i>) = <b class="ca">'+w(soll.a)+'</b> · (<i>x</i> + <b class="cd">'+w(soll.d)+'</b>)<sup>2</sup> + <b class="ce">'+w(soll.e)+'</b>';
}
function felder(){
  var f=document.getElementById("felder"); f.innerHTML="";
  ["a","d","e"].forEach(function(k){
    var b=document.createElement("button"); b.type="button"; b.className="feld"; b.dataset.k=k;
    b.setAttribute("aria-pressed",(!geprueft&&k===aktiv)?"true":"false");
    if(geprueft) b.classList.add(richtig(k)?"r":"f");
    b.innerHTML='<span class="n c'+k+'">'+k+' =</span><span class="w">'+(ein[k]===""?"&nbsp;":ein[k].replace("-","−"))+'</span>';
    b.addEventListener("click",function(){if(geprueft)return;aktiv=k;felder();});
    f.appendChild(b);
  });
}
function zahl(s){ if(s===""||s==="-"||s===",")return NaN; return parseFloat(s.replace(",",".")); }
function richtig(k){return zahl(ein[k])===soll[k]}
var T=document.getElementById("tasten");
["7","8","9","⌫","4","5","6","−","1","2","3",",","0"].forEach(function(t){
  var b=document.createElement("button"); b.type="button"; b.textContent=t; b.dataset.t=t;
  if(t==="⌫")b.setAttribute("aria-label","löschen"); if(t==="−")b.setAttribute("aria-label","Minus");
  if(t==="0")b.style.gridColumn="1 / span 3";
  T.appendChild(b);
});
var wb=document.createElement("button"); wb.type="button"; wb.textContent="→"; wb.dataset.t="→"; wb.setAttribute("aria-label","nächstes Feld"); T.appendChild(wb);
T.addEventListener("click",function(ev){
  var b=ev.target.closest("button"); if(!b||geprueft)return; var t=b.dataset.t, s=ein[aktiv];
  if(t==="⌫") s=s.slice(0,-1);
  else if(t==="−") s=s.charAt(0)==="-"?s.slice(1):"-"+s;
  else if(t===","){ if(s.indexOf(",")<0) s=(s===""||s==="-"?s+"0":s)+","; }
  else if(t==="→"){ aktiv=aktiv==="a"?"d":aktiv==="d"?"e":"a"; felder(); return; }
  else if(s.replace("-","").length<4) s+=t;
  ein[aktiv]=s; felder();
});
function hinweis(){
  var t=[];
  if(!richtig("a")){
    if(soll.a===1) t.push("Vor der Klammer steht nichts: <b>a = 1</b>.");
    else if(soll.a===-1) t.push("Vor der Klammer steht nur ein Minus: <b>a = −1</b>.");
    else if(zahl(ein.a)===-soll.a) t.push("Das Vorzeichen vor "+(soll.d===0?"x²":"der Klammer")+" gehört zu a: <b>a = "+mz(soll.a)+"</b>.");
    else t.push("a ist die Zahl direkt vor "+(soll.d===0?"x²":"der Klammer")+": <b>a = "+mz(soll.a)+"</b>.");
  }
  if(!richtig("d")){
    if(soll.d===0) t.push("Keine Klammer, nur x²: <b>d = 0</b>.");
    else if(zahl(ein.d)===-soll.d) t.push("d steht mit seinem Vorzeichen in der Klammer: (x "+(soll.d>0?"+":"−")+" "+de(soll.d)+") heißt <b>d = "+mz(soll.d)+"</b>.");
    else if(zahl(ein.d)===soll.e) t.push("d steht in der Klammer, e außen: <b>d = "+mz(soll.d)+"</b>.");
    else t.push("d ist die Zahl in der Klammer, mit Vorzeichen: <b>d = "+mz(soll.d)+"</b>.");
  }
  if(!richtig("e")){
    if(soll.e===0) t.push("Hinter der Klammer steht nichts: <b>e = 0</b>.");
    else if(soll.vorn) t.push("e ist die Zahl ohne x, auch wenn sie vorn steht: <b>e = "+mz(soll.e)+"</b>.");
    else t.push("e ist die Zahl hinter dem Quadrat, mit Vorzeichen: <b>e = "+mz(soll.e)+"</b>.");
  }
  return t.join("<br>");
}
document.getElementById("haupt").addEventListener("click",function(){
  var m=document.getElementById("meld");
  if(geprueft==="ende"){verlauf=[];nr=0;neu();return}
  if(!geprueft){
    if(ein.a===""&&ein.d===""&&ein.e===""){m.className="meld f";m.textContent="Tipp auf ein Feld und gib die Zahl ein.";return}
    geprueft=true; var ok=richtig("a")&&richtig("d")&&richtig("e"); verlauf.push(ok); nr++;
    m.className="meld "+(ok?"r":"f");
    m.innerHTML=ok?"<b>Richtig.</b> Scheitel S("+mz(-soll.d)+" | "+mz(soll.e)+")":hinweis();
    var v=document.getElementById("voll"); v.innerHTML='<small>ausgeschrieben</small>'+voll(); v.className="voll da";
    felder(); stand();
    this.textContent=verlauf.length>=N?"Auswerten":"Weiter"; return;
  }
  if(verlauf.length>=N){
    var r=verlauf.filter(Boolean).length;
    m.className="meld "+(r>=N-1?"r":"f");
    m.innerHTML="<b>"+r+" von "+N+" richtig.</b> "+(r>=N-1?"Das sitzt.":"Noch eine Runde – achte auf die Sonderfälle.");
    geprueft="ende"; this.textContent="Neue Runde"; return;
  }
  neu();
});
function stand(){
  var p=document.getElementById("punkte"); p.innerHTML="";
  for(var i=0;i<N;i++){var s=document.createElement("span"); if(i<verlauf.length)s.className=verlauf[i]?"r":"f"; p.appendChild(s);}
  document.getElementById("stand").textContent="Aufgabe "+Math.min(verlauf.length+(geprueft?0:1),N)+" von "+N;
}
neu();
})();
</script>
</body></html>
