<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Lösungen (Muster)</title>
<style>
  :root { --fg:#111; --grau:#666; --linie:#ccc; --an:#111; --bg:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--fg); background:var(--bg); max-width:34rem; margin-inline:auto; }
  h1 { font-size:1.25rem; margin:0 0 .2rem; }
  .hin { color:var(--grau); font-size:.9rem; margin:0 0 1rem; }
  .z { display:grid; grid-template-columns:1.6rem 1fr auto; column-gap:.6rem; row-gap:.45rem; align-items:center; padding:.7rem 0; border-top:1px solid var(--linie); }
  .z .n { align-self:start; } .z .l { grid-column:2 / 4; } .z .wk { grid-column:2; justify-self:start; } .z .k { grid-column:3; } .z .w { grid-column:2 / 4; }
  .katex { white-space:nowrap; }
  .n { font-weight:700; width:1.6rem; flex:none; }
  .l { flex:1; }
  .l small { display:block; color:var(--grau); }
  .l img { display:block; max-width:min(100%,17rem); margin-top:.4rem; }
  .k { display:flex; gap:.35rem; flex:none; }
  .k button { width:2.75rem; height:2.75rem; font-size:1.2rem; border:1.5px solid var(--fg); background:#fff; color:var(--fg); border-radius:6px; }
  .k button[aria-pressed="true"] { background:var(--an); color:#fff; }
  #ab { width:100%; margin:1.2rem 0 .5rem; padding:.9rem; font-size:1.1rem; font-weight:700; border:0; border-radius:8px; background:var(--fg); color:#fff; }
  #ab:disabled { background:#999; }
  #m { min-height:1.5rem; color:var(--grau); }
  .l { min-width:0; } .l .t { display:block; }
  .wk { background:none; border:0; padding:.5rem 0; color:var(--grau); font-size:.9rem; text-decoration:underline; }
  .w { display:none; font-size:.95rem; padding:.1rem 0 .1rem .6rem; border-left:2px solid var(--linie); }
  .w.auf { display:block; } .w div { padding:.12rem 0; }
  #wie { margin:1.4rem 0 0; padding-top:1rem; border-top:1px solid var(--linie); }
  #wie p { margin:0 0 .5rem; } #wie small { color:var(--grau); }
  #wie .k button { width:auto; padding:0 .8rem; font-size:1rem; }
  #dr { display:block; margin:1rem 0 0; background:none; border:0; padding:.4rem 0; color:var(--grau); font-size:.9rem; text-decoration:underline; }
  .nurdruck { display:none; }
  iframe { display:none; }
  @media print {
    body { max-width:none; padding:0; font-size:11pt; }
    .hin, .k, .wk, #ab, #m, #wie, #dr, #nr { display:none !important; }
    .nurdruck { display:block; color:var(--grau); font-size:9pt; }
    .z { break-inside:avoid; padding:.35rem 0; align-items:flex-start; }
    .l img { max-width:6.5cm; }
    .w { display:block; border:0; padding-left:0; color:#333; }
    .z { grid-template-columns:1.6rem 1fr 1fr; align-items:start; } .z .l { grid-column:2; } .z .w { grid-column:3; grid-row:1; }
  }
  #nr { display:none; margin:0 0 1rem; }
  #nr input { width:5rem; font-size:1.1rem; padding:.4rem; border:1.5px solid var(--fg); border-radius:6px; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<h1>Lösungen <span id="kopf"></span></h1>
<p class="hin">Tippe je Frage an: ✓ richtig · × falsch · ? nicht verstanden. Was du nicht geschafft hast, lässt du frei.</p>
<p id="nr"><label>Deine Nummer: <input id="snr" inputmode="numeric" maxlength="4" autocomplete="off"></label></p>
<div id="liste"></div>
<div id="wie"><p>Wie war das Blatt? <small>(freiwillig)</small></p><div class="k" id="wiek"></div></div>
<button id="ab" disabled>Absenden</button>
<p id="m"></p>
<button id="dr" type="button">Druckansicht (Lösungen mit Rechenweg)</button>
<p class="nurdruck" id="fuss"></p>
<iframe name="ziel" title="senden"></iframe>
<script>
// Briefkasten: ein Google-Formular für alle Tests. Aufruf: …/r/#t=<Test>&s=<Schülernummer>
// (hinter #, damit Test und Nummer nicht an den Seitenserver gehen).
// Ein Feld „Meldung“: Test;Schülernummer;Antworten (r richtig, f falsch, u nicht verstanden, - nicht bearbeitet), z. B. ek10;17;rrfurrr---
const FORM = { url: "https://docs.google.com/forms/d/e/1FAIpQLScVAIyR0-hKCMXzbtrj8F7LXRPKd6vxw_XSq0-i5HXuzHBYUQ/formResponse", meldung: "entry.312904931" };
// Testdaten der Probe (Einheitskreis, Kl. 10); später je Test aus einer Datei neben der Seite.
const TESTS = { "ek10": [
  ["1", ""], ["gegen den Uhrzeigersinn", "Start an der positiven x-Achse"], ["(0 | 1)", ""], ["180°", ""],
  ["x = cos α, y = sin α", ""], ["auf der x-Achse", ""], ["sin α = 0,8 und cos α = 0,6", "sin ist die y-, cos die x-Koordinate"],
  ["(0 | −1)", ""], ["die senkrechte", "sie ist die y-Koordinate"],
  ["Kein Punkt des Kreises liegt höher als 1.", "sin = Höhe des Punktes, Radius 1"] ] };
const p = new URLSearchParams(location.hash.slice(1));
const t = (p.get("t") || "muster-scheitel").replace(/[^a-z0-9-]/g, "").slice(0, 24);
let s = (p.get("s") || "").replace(/[^0-9]/g, "").slice(0, 4);
// Lösungen je Test: t/<Test>.json neben der Seite (schreiben aufgabenbank kopftest.py --qr und qr-blatt.py), sonst die Probe oben.
let loes = TESTS[t], titel = "";
const liste = document.getElementById("liste"), ab = document.getElementById("ab"), m = document.getElementById("m");
const wahl = []; let offenGefragt = false, wie = "";
const mathe = e => { if (window.renderMathInElement) renderMathInElement(e, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false }); };
const start = () => {
if (!loes) { m.textContent = "Diesen Test kenne ich nicht."; }
else {
  if (!s) document.getElementById("nr").style.display = "block";
  document.getElementById("kopf").textContent = s ? "· Nr. " + s : "";
  if (titel) document.querySelector("h1").firstChild.textContent = "Lösungen · " + titel + " ";
  document.getElementById("fuss").textContent = "Blatt " + t;
  loes.forEach(([l, an, bild, weg], i) => {
    const z = document.createElement("div"); z.className = "z";
    const n = document.createElement("div"); n.className = "n"; n.textContent = i + 1;
    const d = document.createElement("div"); d.className = "l";
    // Teilaufgaben a) b) c) stehen je in einer eigenen Zeile.
    l.split(/  (?=[a-p]\) )/).forEach(teil => { const sp = document.createElement("span"); sp.className = "t"; sp.textContent = teil; d.appendChild(sp); });
    if (an) { const k = document.createElement("small"); k.textContent = an; d.appendChild(k); }
    // Zeichenaufgabe: Bild der Lösung neben der JSON-Datei (qr-blatt.py --bild), nur Dateiname.
    if (bild && /^[a-z0-9-]+\.(png|svg|jpg)$/.test(bild)) { const b = document.createElement("img"); b.src = "t/" + bild; b.alt = "Lösung zu Aufgabe " + (i + 1); d.appendChild(b); }
    // Rechenweg (Feld loesung der Plätze): zu, bis der Schüler ihn aufklappt; im Druck immer offen.
    let wk = document.createElement("span"), w = null; wk.className = "wk";
    if (weg) { wk = document.createElement("button"); wk.type = "button"; wk.className = "wk"; wk.textContent = "Rechenweg zeigen"; w = document.createElement("div"); w.className = "w";
      weg.split("\n").forEach(x => { const e = document.createElement("div"); e.textContent = x; w.appendChild(e); });
      wk.onclick = () => { wk.textContent = w.classList.toggle("auf") ? "Rechenweg ausblenden" : "Rechenweg zeigen"; }; }
    const k = document.createElement("div"); k.className = "k";
    [["r", "✓", "richtig"], ["f", "×", "falsch"], ["u", "?", "nicht verstanden"]].forEach(([w, zeichen, name]) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = zeichen;
      b.setAttribute("aria-label", "Frage " + (i + 1) + " " + name); b.setAttribute("aria-pressed", "false");
      b.onclick = () => {
        // Noch einmal antippen nimmt die Wahl zurück; gesendet werden darf ab einer gewählten Zeile (Lehrer 10.11.).
        wahl[i] = wahl[i] === w ? "" : w; k.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b && wahl[i] ? "true" : "false"));
        ab.disabled = !wahl.some(Boolean); offenGefragt = false; ab.textContent = "Absenden"; m.textContent = "";
      };
      k.appendChild(b);
    });
    z.append(n, d, wk, k); if (w) z.appendChild(w); liste.appendChild(z);
  });
  mathe(liste);
  // Eine freiwillige Frage zum ganzen Blatt: l zu leicht, p passend, s zu schwer; wird als viertes Feld gesendet.
  [["l", "zu leicht"], ["p", "passend"], ["s", "zu schwer"]].forEach(([w, name]) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = name; b.setAttribute("aria-pressed", "false");
    b.onclick = () => { wie = wie === w ? "" : w; document.querySelectorAll("#wiek button").forEach(x => x.setAttribute("aria-pressed", x === b && wie ? "true" : "false")); };
    document.getElementById("wiek").appendChild(b);
  });
  document.getElementById("dr").onclick = () => window.print();
  ab.onclick = () => {
    const offen = loes.filter((_, j) => !wahl[j]).length;
    if (offen && !offenGefragt) { offenGefragt = true; ab.textContent = "Trotzdem senden"; m.textContent = offen + (offen === 1 ? " Zeile" : " Zeilen") + " ohne Angabe – sie zählen als nicht bearbeitet."; return; }
    const f = document.createElement("form"); f.method = "POST"; f.action = FORM.url; f.target = "ziel";
    const e = document.createElement("input"); e.type = "hidden"; e.name = FORM.meldung; e.value = [t, s || document.getElementById("snr").value.replace(/[^0-9]/g, "").slice(0, 4) || "0", loes.map((_, j) => wahl[j] || "-").join(""), wie].join(";"); f.appendChild(e);
    // Die Antwort von Google lädt in den unsichtbaren Rahmen; erst dann gilt es als gesendet.
    const rahmen = document.querySelector("iframe"); let fertig = false;
    rahmen.addEventListener("load", () => { fertig = true; ab.textContent = "Gesendet"; m.textContent = "Danke – du kannst die Seite schließen."; }, { once: true });
    setTimeout(() => { if (!fertig) { ab.disabled = false; ab.textContent = "Noch einmal senden"; m.textContent = "Das Senden hat nicht geklappt. Hast du Netz?"; } }, 10000);
    document.body.appendChild(f); f.submit();
    ab.disabled = true; ab.textContent = "Sende …";
  };
}
};
window.addEventListener("load", () => {
  if (loes) return start();
  fetch("t/" + t + ".json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => { loes = j && j.l; titel = (j && j.titel) || ""; start(); }).catch(start);
});
</script>
</body>
</html>
