<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nebenwinkel</title>
<!-- Nebenwinkel am Handy (Bestell-Chat 17.11.2026, Lehrerwort: „blatt zum thema nebenwinkel … geht das auch gut als web app?“).
     Bau wie r/trigo („genau richtig“): eine Figur, eine Frage, sofort die Regel. Zehn Fragen in fester Folge:
     4× Nebenwinkel an der Geraden · 2× Kreuzung (daneben oder gegenüber) · 2× Parallelogramm mit verlängerter Seite ·
     2× Raute/Parallelogramm ohne Hilfslinie (wie Basiszettel 2026 A Nr. 9). Antwort über ein eigenes Zifferfeld.
     Keine Uhr, keine Meldung, keine Namen. -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f7fb;color:#18324a}
body{display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
h1{font-size:1.05rem;margin:2px 2px 10px;font-weight:650}
.karte{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(24,50,74,.12);padding:12px 14px 14px}
svg{display:block;width:100%;height:auto}
svg text{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:22px;fill:#18324a;text-anchor:middle;dominant-baseline:central}
.frage{font-size:1.1rem;text-align:center;margin:4px 0 8px;min-height:1.5em}
.ant{height:58px;border:2px solid #1f6fb2;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-variant-numeric:tabular-nums;box-shadow:0 0 0 3px rgba(31,111,178,.15);margin:0 70px}
.ant.r{border-color:#2a9d6a;background:#e3f5ec;box-shadow:none}.ant.f{border-color:#e0a23a;background:#fff6e6;box-shadow:none}
.tasten{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tasten button{height:50px;border:1.5px solid #c5d5e4;background:#fff;border-radius:10px;font:inherit;font-size:1.35rem;color:#18324a}
.tasten button:active{background:#e6eef6}
.haupt{width:100%;margin-top:10px;height:52px;border:0;border-radius:12px;background:#1f6fb2;color:#fff;font:inherit;font-size:1.08rem;font-weight:600}
.haupt:active{background:#195c94}
.meld{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:1rem;line-height:1.45;min-height:46px;text-align:center}
.meld.r{background:#e3f5ec;color:#14533a}.meld.f{background:#fff6e6;color:#6b4a0e}
.fuss{display:flex;justify-content:space-between;font-size:.82rem;color:#5b7389;margin:12px 2px 0}
.punkte{display:flex;gap:4px;align-items:center}
.punkte span{width:10px;height:10px;border-radius:50%;background:#d5e0ea}
.punkte span.r{background:#2a9d6a}.punkte span.f{background:#e0a23a}
:focus-visible{outline:3px solid #f0a202;outline-offset:2px}
</style></head>
<body><main>
<h1>Nebenwinkel: zusammen 180°</h1>
<div class="karte">
  <svg id="bild" viewBox="0 0 400 230" role="img" aria-label="Figur mit zwei Winkeln"></svg>
  <p class="frage" id="frage" aria-live="polite"></p>
  <div class="ant" id="ant" aria-label="deine Antwort"></div>
  <div class="tasten" id="tasten"></div>
  <button class="haupt" id="haupt">Prüfen</button>
  <div class="meld" id="meld" role="status"></div>
  <div class="fuss"><div class="punkte" id="punkte" aria-hidden="true"></div><div id="stand"></div></div>
</div>
</main>
<script src="../signal.js"></script>
<script>
(function(){
"use strict";
var N=10, nr=0, verlauf=[], q=null, ein="", geprueft=false;
var FOLGE=["gerade","gerade","gerade","gerade","kreuzN","kreuzS","paraV","paraV","raute","para"];
function zuf(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function wahl(l){return l[zuf(0,l.length-1)]}
function grad(z){return z+"°"}
var BLAU="#1f6fb2", GRUEN="#2a9d6a";
function rad(w){return w*Math.PI/180}
// Bogen um (x,y) von Winkel a0 bis a1 (mathematisch, gegen den Uhrzeigersinn), mit Text
function bogen(x,y,a0,a1,r,text,farbe,voll){
  var x0=x+r*Math.cos(rad(a0)), y0=y-r*Math.sin(rad(a0)), x1=x+r*Math.cos(rad(a1)), y1=y-r*Math.sin(rad(a1));
  var gross=(a1-a0)>180?1:0, m=rad((a0+a1)/2), rt=(a1-a0)<45?r+22:r*0.58;
  var s='<path d="M'+x+' '+y+' L'+x0+' '+y0+' A'+r+' '+r+' 0 '+gross+' 0 '+x1+' '+y1+' Z" fill="'+(voll||"none")+'" stroke="none"/>';
  s+='<path d="M'+x0+' '+y0+' A'+r+' '+r+' 0 '+gross+' 0 '+x1+' '+y1+'" fill="none" stroke="'+farbe+'" stroke-width="2.5"/>';
  s+='<text x="'+(x+rt*Math.cos(m))+'" y="'+(y-rt*Math.sin(m))+'" style="fill:'+farbe+(farbe!=="#18324a"?";font-weight:bold":"")+'">'+text+'</text>';
  return s;
}
function linie(x0,y0,x1,y1,strich){return '<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y1+'" stroke="#18324a" stroke-width="3" stroke-linecap="round"'+(strich?' stroke-dasharray="7 7" stroke-width="2"':'')+'/>'}
function neu(){
  var art=FOLGE[nr%N], w, s="", such, weg, frage, cx=200, cy=165;
  if(art==="gerade"){
    w=wahl([30,40,50,60,70,80,100,110,120,130,140,150,35,45,65,75,105,125,135,42,58,117,163]);
    s+=linie(40,cy,360,cy)+linie(cx,cy,cx+150*Math.cos(rad(w)),cy-150*Math.sin(rad(w)));
    s+=bogen(cx,cy,0,w,52,grad(w),"#18324a")+bogen(cx,cy,w,180,38,"?",BLAU,"#dceaf7");
    such=180-w; frage="Wie groß ist der Winkel mit dem Fragezeichen?"; weg="Nebenwinkel: 180° − "+grad(w)+" = "+grad(such);
  } else if(art==="kreuzN"||art==="kreuzS"){
    w=wahl([40,50,55,65,70,110,115,125,130,140]); cy=115;
    s+=linie(40,cy,360,cy)+linie(cx-105*Math.cos(rad(w)),cy+105*Math.sin(rad(w)),cx+105*Math.cos(rad(w)),cy-105*Math.sin(rad(w)));
    s+=bogen(cx,cy,0,w,50,grad(w),"#18324a");
    if(art==="kreuzN"){s+=bogen(cx,cy,w,180,36,"?",BLAU,"#dceaf7"); such=180-w; frage="Zwei Geraden kreuzen sich. Wie groß ist der Winkel daneben?"; weg="Daneben liegt der Nebenwinkel: 180° − "+grad(w)+" = "+grad(such);}
    else {s+=bogen(cx,cy,180,180+w,50,"?",BLAU,"#dceaf7"); such=w; frage="Zwei Geraden kreuzen sich. Wie groß ist der Winkel gegenüber?"; weg="Gegenüber liegt der Scheitelwinkel: gleich groß, "+grad(such);}
  } else {
    w=art==="raute"?wahl([52,64,48,72,56]):wahl([50,60,70,75,65,110,115,120,105]);
    var a=art==="raute"?150:wahl([170,190]), b=art==="raute"?150:wahl([110,125]);
    var ux=b*Math.cos(rad(w)), uy=b*Math.sin(rad(w)), breite=a+Math.abs(ux)+(art==="paraV"?70:0);
    var x0=(400-breite)/2+(ux<0?-ux:0); cy=185;
    var A=[x0,cy],B=[x0+a,cy],C=[x0+a+ux,cy-uy],D=[x0+ux,cy-uy];
    s+=linie(A[0],A[1],B[0],B[1])+linie(B[0],B[1],C[0],C[1])+linie(C[0],C[1],D[0],D[1])+linie(D[0],D[1],A[0],A[1]);
    if(art==="paraV"){s+=linie(B[0],B[1],B[0]+70,B[1],true)+bogen(B[0],B[1],0,w,34,"","#8aa0b4");}
    s+=bogen(A[0],A[1],0,w,46,grad(w),"#18324a")+bogen(B[0],B[1],w,180,34,"?",BLAU,"#dceaf7");
    such=180-w;
    frage=art==="paraV"?"Parallelogramm, eine Seite ist verlängert. Wie groß ist der Winkel mit dem Fragezeichen?":(art==="raute"?"Raute. Wie groß ist der Winkel mit dem Fragezeichen?":"Parallelogramm. Wie groß ist der Winkel mit dem Fragezeichen?");
    weg="Nachbarwinkel ergänzen sich zu 180°: 180° − "+grad(w)+" = "+grad(such)+(art==="paraV"?"":" – verlängere in Gedanken die untere Seite, dann siehst du den Nebenwinkel.");
  }
  q={such:such,weg:weg}; ein=""; geprueft=false;
  document.getElementById("bild").innerHTML=s;
  document.getElementById("frage").textContent=frage;
  var a2=document.getElementById("ant"); a2.className="ant"; a2.textContent="";
  var m=document.getElementById("meld"); m.className="meld"; m.textContent="";
  document.getElementById("haupt").textContent="Prüfen"; stand(); T.style.display="";
}
var T=document.getElementById("tasten");
["7","8","9","4","5","6","1","2","3","⌫","0"].forEach(function(t){
  var b=document.createElement("button"); b.type="button"; b.textContent=t; b.dataset.t=t;
  if(t==="⌫")b.setAttribute("aria-label","löschen"); if(t==="0")b.style.gridColumn="2 / span 2";
  T.appendChild(b);
});
T.addEventListener("click",function(ev){
  var b=ev.target.closest("button"); if(!b||geprueft)return; var t=b.dataset.t;
  if(t==="⌫") ein=ein.slice(0,-1); else if(ein.length<3) ein+=t;
  document.getElementById("ant").textContent=ein===""?"":ein+"°";
});
document.getElementById("haupt").addEventListener("click",function(){
  var m=document.getElementById("meld"), a=document.getElementById("ant");
  if(geprueft==="ende"){verlauf=[];nr=0;neu();return}
  if(!geprueft){
    if(ein===""){m.className="meld f";m.textContent="Tipp die Gradzahl ein.";return}
    var ok=parseInt(ein,10)===q.such; geprueft=true; verlauf.push(ok); nr++;
    a.className="ant "+(ok?"r":"f"); m.className="meld "+(ok?"r":"f"); Signal.blitz(ok);
    m.textContent=ok?"Richtig.":"Noch nicht.";   // Lösung nur auf Wunsch, bei richtig keine (Register 21.11.11)
    if(!ok) Signal.knopf(m,function(sp){sp.textContent=q.weg+(q.weg.slice(-1)==="."?"":".");});
    this.textContent=verlauf.length>=N?"Auswerten":"Weiter"; stand();
    // W83 (L 21.11.): nach richtig von selbst weiter, nach falsch nur noch, was falsch war (Eingabe weg)
    if(ok){var h=this,n0=nr;setTimeout(function(){if(nr===n0&&geprueft===true)h.click();},1000);} else T.style.display="none";
    return;
  }
  if(verlauf.length>=N){
    var r=verlauf.filter(Boolean).length;
    m.className="meld r"; m.textContent=r+" von "+N+" richtig."+(r>=N-1?" Das sitzt.":" Noch eine Runde macht es sicher.");
    geprueft="ende"; this.textContent="Neue Runde"; return;
  }
  neu();
});
function stand(){
  var p=document.getElementById("punkte"); p.innerHTML="";
  for(var i=0;i<N;i++){var s=document.createElement("span"); if(i<verlauf.length)s.className=verlauf[i]?"r":"f"; p.appendChild(s);}
  document.getElementById("stand").textContent=verlauf.length+" von "+N;
}
neu();
})();
</script>
</body></html>
