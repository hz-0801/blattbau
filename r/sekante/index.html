<title>Sekante wird Tangente</title>
<!-- Entdecken: Q wandert auf dem Graphen zu P, die Sekante PQ dreht sich zur Tangente (Lehrer, aufgabenbank bau/befunde-M10.md #336:
     Q soll als Animation zu P wandern; Runde Blockblätter W114 P2, Blockblatt „Ableitung mit der h-Methode“, QR neben der Skizze
     im Feld „Die Idee“). Wörter wie im Blatt: Sekante, Tangente, Differenzenquotient m = (f(x₀+h) − f(x₀)) : h, Δy, h = Δx,
     Ableitung f′(x₀). Kein Prüfen, kein Signal, keine Meldung, keine Namen.
     Aufbau: Auswahl f (x², 2x², x² − 3x, x³) und x₀ (−2 … 3); Schieber h (±2 … ±0,01, nie 0); Graph mit P, Q, Sekante,
     Steigungsdreieck (h, Δy), Tangente per Schalter; darunter der Differenzenquotient mit eingesetzten Zahlen und die Tabelle
     h | m (jedes neue h eine Zeile, Löschen-Knopf). „Q wandert“: h läuft 2 → 0,01 (bzw. −2 → −0,01, je nach Vorzeichen von h),
     am Ende die Tangente mit m = f′(x₀). Alle Zahlen exakt (h hat höchstens zwei Nachkommastellen).
     Adresse setzt den Start: #f=x2&x0=3&h=1 (f = x2 | 2x2 | x2-3x | x3; x0 ganz von −2 bis 3; h aus der Schieberliste,
     sonst der nächste Wert; Komma oder Punkt), dazu &t=1 für Tangente an. Beispiel: …/r/sekante/#f=x3&x0=1&h=-1
     Prüfung der Rechnung: node r/sekante/pruefe.mjs (liest den Block RECHNUNG aus dieser Datei). -->

<body><main>
<h1>Sekante wird Tangente</h1>
<p class="intro">Zieh an <i>h</i>: Q rückt auf P zu, die Sekante dreht sich. „Q wandert“ zeigt es von selbst.</p>
<div class="spalten">
<div class="karte">
  <div class="wahl"><span class="lab"><i>f</i>(<i>x</i>) =</span><div class="kn" id="wf" role="group" aria-label="Funktion f"></div></div>
  <div class="wahl"><span class="lab"><i>x</i><sub>0</sub> =</span><div class="kn" id="wx" role="group" aria-label="Stelle x0"></div></div>
  <canvas id="c" width="840" height="780" aria-label="Graph von f mit P, Q, Sekante und Steigungsdreieck"></canvas>
  <div class="regler">
    <div class="n">h</div>
    <button type="button" id="hm" aria-label="h kleiner">−</button>
    <input type="range" id="rh" min="0" max="15" step="1" aria-label="h">
    <button type="button" id="hp" aria-label="h größer">+</button>
    <div class="w" id="wh"></div>
  </div>
  <p class="skala">h von −2 bis −0,01 und von 0,01 bis 2 – nie 0</p>
  <div class="knoepfe">
    <button type="button" id="los">Q wandert</button>
    <label class="schalter"><input type="checkbox" id="tg"> Tangente</label>
  </div>
</div>
<div class="karte">
  <div class="pq" id="pq"></div>
  <p class="marke">Steigung der Sekante PQ – Differenzenquotient:</p>
  <div class="dq" id="dq" aria-live="polite"></div>
  <div class="abl" id="abl" hidden></div>
  <p class="marke" id="cap"></p>
  <div class="tab" id="tabk"><table><thead><tr><th>h</th><th>m</th></tr></thead><tbody id="tb"></tbody></table></div>
  <button type="button" id="weg">Tabelle löschen</button>
</div>
</div>
</main>
<script src="../katex/katex.min.js"></script>
<script>
{
"use strict";
/* RECHNUNG – Anfang (pruefe.mjs liest diesen Block und rechnet nach; kein DOM hier) */
const FUNK={
  "x2":   {name:"x²",      tex:"x^2",    f:x=>x*x,     f1:x=>2*x},
  "2x2":  {name:"2x²",     tex:"2x^2",   f:x=>2*x*x,   f1:x=>4*x},
  "x2-3x":{name:"x² − 3x", tex:"x^2-3x", f:x=>x*x-3*x, f1:x=>2*x-3},
  "x3":   {name:"x³",      tex:"x^3",    f:x=>x*x*x,   f1:x=>3*x*x}
};
const HW=[-2,-1.5,-1,-0.5,-0.2,-0.1,-0.05,-0.01,0.01,0.05,0.1,0.2,0.5,1,1.5,2];
const X0=[-2,-1,0,1,2,3];
const FOLGE=[2,1.5,1,0.5,0.2,0.1,0.05,0.01];
// h hat höchstens zwei Nachkommastellen, x₀ ist ganz: f-Werte haben höchstens sechs, m höchstens vier – r6 macht sie exakt.
const r6=v=>{const w=Math.round(v*1e6)/1e6;return w===0?0:w};
function rechne(fk,x0,h){
  if(!FUNK[fk]||h===0||!isFinite(h))throw new Error("rechne: f="+fk+" h="+h);
  const F=FUNK[fk],x1=r6(x0+h),y0=r6(F.f(x0)),y1=r6(F.f(x1)),dy=r6(y1-y0);
  return {x1,y0,y1,dy,m:r6(dy/h),abl:r6(F.f1(x0))};
}
function zahl(v){let s=r6(v).toFixed(6);if(s.includes("."))s=s.replace(/0+$/,"").replace(/\.$/,"");return s}   // "-0.5"
const zH=v=>zahl(v).replace(".",",").replace("-","−");                                              // −0,5
const zT=v=>zahl(v).replace(".","{,}");                                                             // -0{,}5
const zTk=v=>v<0?"("+zT(v)+")":zT(v);
function texDQ(fk,x0,h){   // vier Zeilen: allgemein · eingesetzt · Funktionswerte · ausgerechnet
  const r=rechne(fk,x0,h);
  return "\\begin{aligned}m&=\\frac{f(x_0+h)-f(x_0)}{h}\\\\&=\\frac{f("+zT(r.x1)+")-f("+zT(x0)+")}{"+zT(h)+"}\\\\"+
         "&=\\frac{"+zT(r.y1)+"-"+zTk(r.y0)+"}{"+zT(h)+"}\\\\"+
         "&=\\frac{"+zT(r.dy)+"}{"+zT(h)+"}=\\mathbf{"+zT(r.m)+"}\\end{aligned}";
}
/* RECHNUNG – Ende */

const ist={f:"x2",x0:1,h:1,t:false};
const H={}; location.hash.slice(1).split("&").forEach(t=>{const [k,v]=t.split("=");if(k)H[k]=decodeURIComponent(v||"")});
if(FUNK[H.f])ist.f=H.f;
if(H.x0!==undefined){const v=parseInt(H.x0.replace("−","-"),10);if(X0.includes(v))ist.x0=v;}
if(H.h!==undefined){const v=parseFloat(H.h.replace(",",".").replace("−","-"));
  if(isFinite(v)&&v!==0)ist.h=HW.reduce((b,w)=>Math.abs(w-v)<Math.abs(b-v)?w:b,HW[0]);}
if(H.t==="1")ist.t=true;

const $=id=>document.getElementById(id);
const C=$("c"),X=C.getContext("2d"),BW=C.width,BH=C.height;
let fen=null;
const px=x=>(x-fen.xmin)/(fen.xmax-fen.xmin)*BW, py=y=>BH-(y-fen.ymin)/(fen.ymax-fen.ymin)*BH;
function fenster(){
  const F=FUNK[ist.f],x0=ist.x0,xmin=Math.min(-1.4,x0-2.6),xmax=Math.max(1.4,x0+2.6);
  let lo=0,hi=0;for(let x=x0-2;x<=x0+2.0001;x+=0.05){const y=F.f(x);lo=Math.min(lo,y);hi=Math.max(hi,y)}
  const sp=hi-lo||1,unten=-lo<hi,ymin=lo-(unten?0.17:0.1)*sp,ymax=hi+(unten?0.1:0.17)*sp;   // Platz für x₀ und x₀ + h auf der leeren Seite der x-Achse
  const st=[0.5,1,2,5,10,20,25,50,100].find(s=>(ymax-ymin)/s<=9);
  fen={xmin,xmax,ymin,ymax,st};
}
const de=v=>zH(v);
function halo(t,x,y,farbe,font){X.font=font;X.lineWidth=8;X.strokeStyle="rgba(255,255,255,.92)";X.lineJoin="round";X.strokeText(t,x,y);X.fillStyle=farbe;X.fillText(t,x,y)}
function gerade(x0,y0,m,farbe,strich){
  // zeichnet y = y0 + m(x − x0) und gibt den sichtbaren Teil zurück
  let xl=fen.xmin,xr=fen.xmax;
  if(m!==0){const a=x0+(fen.ymin-y0)/m,b=x0+(fen.ymax-y0)/m;xl=Math.max(xl,Math.min(a,b));xr=Math.min(xr,Math.max(a,b))}
  X.save();X.beginPath();X.rect(0,0,BW,BH);X.clip();
  X.beginPath();X.moveTo(px(fen.xmin),py(y0+m*(fen.xmin-x0)));X.lineTo(px(fen.xmax),py(y0+m*(fen.xmax-x0)));
  X.strokeStyle=farbe;X.lineWidth=4.5;X.setLineDash(strich);X.stroke();X.restore();
  return {x0,y0,m,xl,xr,farbe};
}
const FW="bold 34px system-ui,sans-serif";
const schneidet=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
function wort(g,text,unten,lage,meiden){
  // Wort an der Geraden: erste Stelle (Anteile in lage, von links gezählt), die im Bild liegt und nichts in meiden trifft
  X.font=FW;const w=X.measureText(text).width+8,hh=38,ay=py(0);let erst=null;
  if(g.xr>g.xl)for(const t of lage){const xs=g.xl+t*(g.xr-g.xl),cx=px(xs),cy=py(g.y0+g.m*(xs-g.x0));
    const r={x:cx-w/2,y:unten?cy+14:cy-14-hh,w,h:hh};if(!erst)erst=r;
    if(r.x<6||r.x+r.w>BW-6||r.y<6||r.y+r.h>BH-6)continue;
    if(schneidet(r,{x:0,y:ay-8,w:BW,h:56})||meiden.some(m=>schneidet(r,m)))continue;
    erst=r;erst.gut=1;break}
  if(!erst)return null;
  const x=Math.min(BW-erst.w-6,Math.max(6,erst.x)),y=Math.min(BH-erst.h-6,Math.max(6,erst.y));
  X.textAlign="left";X.textBaseline="top";halo(text,x+4,y+2,g.farbe,FW);return {x,y,w:erst.w,h:erst.h};
}
function kastenOrt(F,z1,z2,pq){
  // die Ecke, in der der Kasten am wenigsten verdeckt: Graph, P und Q, x-Achse mit Zahlen, y-Achse
  X.font="bold 36px system-ui,sans-serif";const w=Math.max(X.measureText(z1).width,z2?X.measureText(z2).width:0)+28,h=z2?100:56;
  const ax=px(0),ay=py(0);let best=null;
  for(const [x,y] of [[ax+64,14],[BW-w-40,14],[14,14],[ax-w-84,14],[ax+64,BH-h-14],[BW-w-40,BH-h-14],[14,BH-h-14],[ax-w-84,BH-h-14]]){
    const k={x,y,w,h};if(x<6||x+w>BW-6)continue;let n=0;
    for(let i=0;i<=200;i++){const xx=fen.xmin+i/200*(fen.xmax-fen.xmin),q={x:px(xx)-6,y:py(F.f(xx))-6,w:12,h:12};if(schneidet(k,q))n++}
    if(schneidet(k,{x:0,y:ay-95,w:BW,h:190}))n+=60;if(schneidet(k,{x:ax-60,y:0,w:80,h:BH}))n+=60;pq.forEach(q=>{if(schneidet(k,q))n+=200});
    if(!best||n<best.n)best={...k,n};}
  return best;
}
function punkt(x,y,farbe){X.beginPath();X.arc(px(x),py(y),12,0,6.3);X.fillStyle=farbe;X.fill();X.lineWidth=4;X.strokeStyle="#fff";X.stroke()}
let mZeige=null;   // zuletzt gezeigte Rechnung (bleibt während der Fahrt zwischen zwei Halten stehen)
function zeichne(hBild,fahrt){
  const F=FUNK[ist.f],x0=ist.x0,y0=F.f(x0),x1=x0+hBild,y1=F.f(x1);
  X.setLineDash([]);X.fillStyle="#fff";X.fillRect(0,0,BW,BH);
  // Gitter
  X.lineWidth=1.5;X.strokeStyle="#dbe5ee";X.beginPath();
  for(let i=Math.ceil(fen.xmin);i<=fen.xmax;i++){X.moveTo(px(i),0);X.lineTo(px(i),BH)}
  for(let j=Math.ceil(fen.ymin/fen.st);j*fen.st<=fen.ymax;j++){X.moveTo(0,py(j*fen.st));X.lineTo(BW,py(j*fen.st))}
  X.stroke();
  // Achsen
  const ax=px(0),ay=py(0);
  X.strokeStyle="#18324a";X.fillStyle="#18324a";X.lineWidth=3;X.beginPath();X.moveTo(0,ay);X.lineTo(BW-4,ay);X.moveTo(ax,BH);X.lineTo(ax,4);X.stroke();
  X.beginPath();X.moveTo(BW,ay);X.lineTo(BW-22,ay-10);X.lineTo(BW-22,ay+10);X.closePath();X.fill();
  X.beginPath();X.moveTo(ax,0);X.lineTo(ax-10,22);X.lineTo(ax+10,22);X.closePath();X.fill();
  X.font="30px system-ui,sans-serif";X.fillStyle="#4a6278";X.lineWidth=2;
  for(let i=Math.ceil(fen.xmin);i<=fen.xmax-0.3;i++){if(i===0)continue;
    X.beginPath();X.moveTo(px(i),ay-7);X.lineTo(px(i),ay+7);X.stroke();X.textAlign="center";X.textBaseline="top";X.fillText(de(i),px(i),ay+11)}
  for(let j=Math.ceil(fen.ymin/fen.st);j*fen.st<=fen.ymax;j++){const v=j*fen.st;if(v===0||py(v)<40||py(v)>BH-20)continue;
    X.beginPath();X.moveTo(ax-7,py(v));X.lineTo(ax+7,py(v));X.stroke();X.textAlign="right";X.textBaseline="middle";X.fillText(de(v),ax-13,py(v))}
  X.font="italic 34px 'Times New Roman',serif";X.fillStyle="#18324a";X.textAlign="right";X.textBaseline="bottom";X.fillText("x",BW-8,ay-12);
  X.textAlign="left";X.textBaseline="top";X.fillText("y",ax+16,4);
  // Graph von f
  X.save();X.beginPath();X.rect(0,0,BW,BH);X.clip();X.beginPath();let erst=true;
  for(let x=fen.xmin;x<=fen.xmax+1e-9;x+=0.01){const y=F.f(x),q=py(y);if(q<-400||q>BH+400){erst=true;continue}
    if(erst){X.moveTo(px(x),q);erst=false}else X.lineTo(px(x),q)}
  X.strokeStyle="#18324a";X.lineWidth=5;X.lineJoin="round";X.stroke();X.restore();
  { // „f“ am Graphen, links oben neben der Kurve
    let xf=fen.xmin+0.06*(fen.xmax-fen.xmin);for(let k=0;k<40&&(py(F.f(xf))<60||py(F.f(xf))>BH-60);k++)xf+=0.02*(fen.xmax-fen.xmin);
    X.textAlign="left";X.textBaseline="middle";halo("f",px(xf)+18,py(F.f(xf)),"#18324a","italic bold 38px 'Times New Roman',serif");
  }
  // Lote auf die x-Achse, x₀ und x₀ + h
  X.save();X.setLineDash([8,8]);X.strokeStyle="#9aa9b6";X.lineWidth=2.5;X.beginPath();
  X.moveTo(px(x0),py(y0));X.lineTo(px(x0),ay);X.moveTo(px(x1),py(y1));X.lineTo(px(x1),ay);X.stroke();X.restore();
  const abst=Math.abs(px(x1)-px(x0)),oben=y0<0,zy=oben?ay-14:ay+48;
  X.textBaseline=oben?"bottom":"top";X.textAlign="center";
  halo("x₀",px(x0)+(abst<110?(hBild>0?-14:14):0),zy,"#18324a","italic 34px 'Times New Roman',serif");
  if(abst>=110)halo("x₀ + h",px(x1),zy,"#18324a","italic 34px 'Times New Roman',serif");
  // Tangente
  const gt=ist.t?gerade(x0,y0,F.f1(x0),"#b5471f",[20,12]):null;
  // Steigungsdreieck: von P waagrecht um h, dann senkrecht um Δy bis Q
  X.save();X.lineWidth=5;X.strokeStyle="#2a7d4f";X.lineCap="round";X.beginPath();
  X.moveTo(px(x0),py(y0));X.lineTo(px(x1),py(y0));X.lineTo(px(x1),py(y1));X.stroke();X.restore();
  // Sekante
  const gs=gerade(x0,y0,(y1-y0)/hBild,"#1f6fb2",[]);
  // Beschriftung des Dreiecks (nur wenn Platz ist, nicht während der Fahrt)
  const belegt=[];
  if(!fahrt){
    // außen am Dreieck; ragt das Wort aus dem Bild oder liegt es auf den Zahlen der x-Achse, dann innen
    const r=rechne(ist.f,x0,hBild),fb="#2a7d4f",ft="bold 32px system-ui,sans-serif";X.font=ft;
    const band={x:0,y:oben?ay-90:ay-8,w:BW,h:oben?136:100},drin=q=>q.x>=6&&q.y>=6&&q.x+q.w<=BW-6&&q.y+q.h<=BH-6;
    const setze=(t,lagen)=>{const w=X.measureText(t).width+6;let q=null;
      for(const [x,y] of lagen){const k={x,y,w,h:36};if(!q)q=k;if(drin(k)&&!schneidet(k,band)){q=k;break}}
      q.x=Math.min(BW-q.w-6,Math.max(6,q.x));q.y=Math.min(BH-q.h-6,Math.max(6,q.y));X.textAlign="left";X.textBaseline="top";halo(t,q.x+3,q.y,fb,ft);belegt.push(q)};
    const ty=py(y0),qy=py(y1),mx=(px(x0)+px(x1))/2,tw=X.measureText("h = "+de(hBild)).width+6;
    if(abst>=120)setze("h = "+de(hBild),qy<ty?[[mx-tw/2,ty+8],[mx-tw/2,ty-44]]:[[mx-tw/2,ty-44],[mx-tw/2,ty+8]]);
    const hoch=Math.abs(qy-ty),dw=X.measureText("Δy = "+de(r.dy)).width+6,vx=px(x1),my=(ty+qy)/2-18;
    if(hoch>=70)setze("Δy = "+de(r.dy),hBild>0?[[vx+12,my],[vx-12-dw,my]]:[[vx-12-dw,my],[vx+12,my]]);
  }
  // Punkte
  punkt(x0,y0,"#18324a");punkt(x1,y1,"#1f6fb2");
  X.textBaseline="bottom";
  X.textAlign=hBild>0?"right":"left";halo("P",px(x0)+(hBild>0?-14:14),py(y0)-10,"#18324a","italic bold 40px 'Times New Roman',serif");
  X.textAlign=hBild>0?"left":"right";halo("Q",px(x1)+(hBild>0?14:-14),py(y1)-10,"#1f6fb2","italic bold 40px 'Times New Roman',serif");
  // Kasten mit m (und f′(x₀)) in der Ecke, wo der Graph tiefer liegt; Wörter Sekante und Tangente so, dass nichts überdeckt wird
  const z1=mZeige?"m = "+de(mZeige.m):"",z2=mZeige&&ist.t?"f′("+de(x0)+") = "+de(mZeige.abl):"",um=(x,y)=>({x:px(x)-75,y:py(y)-75,w:150,h:150}),ka=kastenOrt(F,z1,z2,[um(x0,y0),um(x1,y1)]);
  const meiden=[ka,um(x0,y0),um(x1,y1),...belegt];
  const vorn=[],hinten=[];for(let t=0.06;t<0.95;t+=0.04){vorn.push(t);hinten.unshift(t)}
  const ws=wort(gs,"Sekante",false,hinten,meiden);if(ws)meiden.push(ws);
  if(gt)wort(gt,"Tangente",true,vorn.concat(hinten),meiden);
  if(mZeige){
    X.font="bold 36px system-ui,sans-serif";const bx=ka.x,by=ka.y,w=ka.w,hh=ka.h;
    X.fillStyle="rgba(255,255,255,.93)";X.strokeStyle="#c5d5e4";X.lineWidth=2;X.beginPath();X.roundRect(bx,by,w,hh,10);X.fill();X.stroke();
    X.textAlign="left";X.textBaseline="top";X.fillStyle="#1f6fb2";X.fillText(z1,bx+14,by+10);
    if(z2){X.fillStyle="#b5471f";X.fillText(z2,bx+14,by+54)}
  }
}
function texIn(el,tex,anz){try{katex.render(tex,el,{displayMode:!!anz,throwOnError:true})}catch(e){el.textContent=tex;console.error(e)}}
function zeigeRechnung(){
  const F=FUNK[ist.f],r=rechne(ist.f,ist.x0,ist.h);mZeige=r;
  $("pq").innerHTML='<span><i>f</i>(<i>x</i>) = '+F.name.replace(/x/g,"<i>x</i>")+'</span><span><i>P</i>('+de(ist.x0)+' | '+de(r.y0)+')</span><span style="color:#1f6fb2"><i>Q</i>('+de(r.x1)+' | '+de(r.y1)+')</span>';
  texIn($("dq"),texDQ(ist.f,ist.x0,ist.h),true);
  const a=$("abl");a.hidden=!ist.t;
  if(ist.t){a.innerHTML='Tangente in <i>P</i>, Ableitung: <span id="ablf"></span>';texIn($("ablf"),"m=f'("+zT(ist.x0)+")="+zT(r.abl),false)}
  $("wh").textContent=de(ist.h);$("rh").value=HW.indexOf(ist.h);
}
// Tabelle h | m: jedes neue h eine Zeile
let zeilen=[];
function tabelle(){
  $("cap").innerHTML='Tabelle für <i>f</i>(<i>x</i>) = '+FUNK[ist.f].name.replace(/x/g,"<i>x</i>")+', <i>x</i><sub>0</sub> = '+de(ist.x0);
  $("tb").innerHTML=zeilen.map(z=>'<tr'+(z.h===ist.h?' class="neu"':'')+'><td>'+de(z.h)+'</td><td>'+de(z.m)+'</td></tr>').join("");
  const n=$("tb").querySelector("tr.neu");if(n){const k=$("tabk");k.scrollTop=n.offsetTop-k.clientHeight+n.offsetHeight+4}
}
function merke(){if(!zeilen.some(z=>z.h===ist.h))zeilen.push({h:ist.h,m:rechne(ist.f,ist.x0,ist.h).m});tabelle()}
function neu(){zeigeRechnung();zeichne(ist.h,false);merke()}
function knoepfe(){
  $("wf").innerHTML=Object.keys(FUNK).map(k=>'<button type="button" data-f="'+k+'" aria-pressed="'+(k===ist.f)+'">'+FUNK[k].name+'</button>').join("");
  $("wx").innerHTML=X0.map(v=>'<button type="button" data-x="'+v+'" aria-pressed="'+(v===ist.x0)+'">'+de(v)+'</button>').join("");
  $("tg").checked=ist.t;
}
// Fahrt „Q wandert“
let lauf=0;
function halt(){if(lauf){lauf=0;$("los").textContent="Q wandert";$("los").classList.remove("laeuft")}}
const ruhig=matchMedia("(prefers-reduced-motion: reduce)").matches;
function warte(ms,id){return new Promise(ok=>setTimeout(()=>ok(lauf===id),ms))}
function gleite(von,bis,ms,id){return new Promise(ok=>{
  if(ruhig){ok(lauf===id);return}
  const t0=performance.now();
  function schritt(t){if(lauf!==id){ok(false);return}
    const u=Math.min(1,(t-t0)/ms),e=u<.5?2*u*u:1-2*(1-u)*(1-u),hb=von*Math.pow(bis/von,e);
    zeichne(hb,u<1);if(u<1)requestAnimationFrame(schritt);else ok(true)}
  requestAnimationFrame(schritt)})}
async function fahre(){
  if(lauf){halt();neu();return}
  const id=lauf=Date.now(),s=ist.h<0?-1:1;
  $("los").textContent="Anhalten";$("los").classList.add("laeuft");
  ist.t=false;$("tg").checked=false;
  const alt=ist.h;
  if(alt!==s*2){if(!await gleite(alt,s*2,500,id))return;}
  ist.h=s*2;neu();
  for(let i=1;i<FOLGE.length;i++){
    if(!await warte(i===1?900:650,id))return;
    if(!await gleite(s*FOLGE[i-1],s*FOLGE[i],700,id))return;
    ist.h=s*FOLGE[i];neu();
  }
  if(!await warte(700,id))return;
  ist.t=true;$("tg").checked=true;neu();halt();
}
// Bedienung
$("wf").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;halt();ist.f=b.dataset.f;zeilen=[];fenster();knoepfe();neu()});
$("wx").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;halt();ist.x0=+b.dataset.x;zeilen=[];fenster();knoepfe();neu()});
$("rh").addEventListener("input",ev=>{halt();ist.h=HW[+ev.target.value];neu()});
$("hm").addEventListener("click",()=>{halt();ist.h=HW[Math.max(0,HW.indexOf(ist.h)-1)];neu()});
$("hp").addEventListener("click",()=>{halt();ist.h=HW[Math.min(HW.length-1,HW.indexOf(ist.h)+1)];neu()});
$("tg").addEventListener("change",ev=>{ist.t=ev.target.checked;neu()});
$("los").addEventListener("click",fahre);
$("weg").addEventListener("click",()=>{zeilen=[];tabelle()});
window.addEventListener("hashchange",()=>location.reload());
fenster();knoepfe();neu();
}
