<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Parabel ablesen</title>
<!-- Parabel ablesen – Übung am Handy (Bestell-Chat 17.11.2026, Lehrerwort: „Web-App, wo er das Ablesen von Parameter üben kann.
     Alle Spezialfälle.“). Schreibweise der Schule: f(x) = a(x + d)² + e, Scheitel S(−d | e).
     Eine Parabel je Bildschirm; der Schüler stellt a, d und e ein, seine Gleichung steht darunter, nach „Prüfen“ liegt seine
     Parabel gestrichelt über der gesuchten. Fünf Stufen (nur e · nur d · d und e · nur a · alle drei) und „Gemischt“.
     Keine Uhr, keine Meldung, keine Namen; der Stand je Stufe bleibt nur auf dem Gerät (localStorage). -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f7fb;color:#18324a}
body{display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
h1{font-size:1.05rem;margin:2px 0 8px;font-weight:650;letter-spacing:.01em}
.stufen{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.stufen::-webkit-scrollbar{display:none}
.stufen button{flex:0 0 auto;border:1.5px solid #c5d5e4;background:#fff;color:#18324a;border-radius:999px;padding:7px 12px;font:inherit;font-size:.86rem}
.stufen button[aria-pressed=true]{background:#18324a;border-color:#18324a;color:#fff}
.stufen button .ok{color:#2a9d6a;margin-left:4px}
.stufen button[aria-pressed=true] .ok{color:#9be3c0}
.karte{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(24,50,74,.12);padding:10px;margin-top:6px}
canvas{display:block;width:100%;height:auto;border-radius:8px;touch-action:manipulation}
.frage{font-size:.95rem;margin:10px 2px 2px}
.gl{font-size:1.5rem;text-align:center;margin:8px 0 10px;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;min-height:2.2rem;white-space:nowrap}
.gl i{font-style:italic}.gl sup{font-size:.62em}
.gl .br{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.05;margin:0 1px}
.gl .br span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.regler{display:grid;grid-template-columns:2.2rem 3rem 1fr 3rem;gap:8px 8px;align-items:center}
.regler .n{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-size:1.25rem;text-align:center}
.regler .w{text-align:center;font-variant-numeric:tabular-nums;font-size:1.15rem;background:#f3f7fb;border-radius:8px;padding:8px 0}
.regler button{height:44px;border:1.5px solid #c5d5e4;background:#fff;border-radius:10px;font-size:1.4rem;line-height:1;color:#18324a}
.regler button:active{background:#e6eef6}
.regler .aus{opacity:.35;pointer-events:none}
.haupt{width:100%;margin-top:12px;height:50px;border:0;border-radius:12px;background:#1f6fb2;color:#fff;font:inherit;font-size:1.08rem;font-weight:600}
.haupt:active{background:#195c94}
.meld{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.4;display:none}
.meld.r{display:block;background:#e3f5ec;color:#14533a}
.meld.f{display:block;background:#fdecea;color:#7a2a22}
.meld b{font-weight:650}
.fuss{display:flex;justify-content:space-between;font-size:.82rem;color:#5b7389;margin:10px 2px 0}
.punkte{display:flex;gap:4px}
.punkte span{width:10px;height:10px;border-radius:50%;background:#d5e0ea}
.punkte span.r{background:#2a9d6a}.punkte span.f{background:#d9695d}
:focus-visible{outline:3px solid #f0a202;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.meld{animation:ein .18s ease-out}@keyframes ein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style></head>
<body><main>
<h1>Parabel ablesen</h1>
<div class="stufen" id="stufen" role="group" aria-label="Stufe"></div>
<div class="karte">
  <canvas id="c" width="840" height="840" aria-label="Koordinatensystem mit einer Parabel"></canvas>
  <p class="frage" id="frage"></p>
  <div class="gl" id="gl" aria-live="polite"></div>
  <div class="regler" id="regler"></div>
  <button class="haupt" id="haupt">Prüfen</button>
  <div class="meld" id="meld" role="status"></div>
  <div class="fuss"><div class="punkte" id="punkte" aria-hidden="true"></div><div id="stand"></div></div>
</div>
</main>
<script src="../signal.js"></script>
<script>
(function(){
"use strict";
// ---------- Stufen: welche Parameter wirken, welche Werte vorkommen ----------
var A_ALLE=[-3,-2,-1,-0.5,-0.25,0.25,0.5,2,3], A_REGLER=[-3,-2,-1,-0.5,-0.25,0.25,0.5,1,2,3];
var STUFEN=[
 {k:"e",  name:"nur e",      text:"Die Normalparabel wurde nach oben oder unten verschoben.", frei:{e:1}},
 {k:"d",  name:"nur d",      text:"Die Normalparabel wurde nach links oder rechts verschoben.", frei:{d:1}},
 {k:"de", name:"d und e",    text:"Die Normalparabel wurde verschoben. Lies den Scheitel ab.", frei:{d:1,e:1}},
 {k:"a",  name:"nur a",      text:"Gestreckt, gestaucht oder gespiegelt? Lies den Punkt bei x = 1 oder x = 2 ab.", frei:{a:1}},
 {k:"ade",name:"a, d und e", text:"Lies den Scheitel ab, dann geh 1 oder 2 nach rechts.", frei:{a:1,d:1,e:1}},
 {k:"mix",name:"Gemischt",   text:"Welche Gleichung hat die Parabel?", frei:{a:1,d:1,e:1}, mix:1}
];
var N=8, LS="parabel-ablesen-1";
var st=0, soll=null, ist={a:1,d:0,e:0}, geprueft=false, verlauf=[], vorher="";
var fertig={}; try{fertig=JSON.parse(localStorage.getItem(LS)||"{}")}catch(x){}

function zuf(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function wahl(l){return l[zuf(0,l.length-1)]}

// Aufgabe so wählen, dass Scheitel und mindestens ein weiterer Gitterpunkt im Bild liegen (x, y von −6 bis 6)
function neu(){
  var S=STUFEN[st], f=S.frei, p, i=0, art=S.k;
  if(S.mix) art=wahl(["e","d","de","a","ade","ade","neg","bruch","achse"]);
  do{
    p={a:1,d:0,e:0};
    if(art==="e") p.e=wahl([-5,-4,-3,-2,-1,1,2,3,4]);
    else if(art==="d") p.d=wahl([-5,-4,-3,-2,-1,1,2,3,4,5]);
    else if(art==="de"){p.d=wahl([-4,-3,-2,-1,1,2,3,4]);p.e=wahl([-5,-4,-3,-2,-1,1,2,3]);}
    else if(art==="a") p.a=wahl(A_ALLE);
    else if(art==="neg"){p.a=-1;p.d=zuf(-4,4);p.e=zuf(-2,5);}
    else if(art==="bruch"){p.a=wahl([0.5,-0.5,0.25,-0.25]);p.d=wahl([-4,-2,0,2,4]);p.e=zuf(-4,4);}
    else if(art==="achse"){p.a=wahl([-2,-1,1,2]);if(Math.random()<.5){p.d=zuf(-4,4);p.e=0}else{p.d=0;p.e=zuf(-4,4)}}
    else {p.a=wahl(A_ALLE);p.d=zuf(-4,4);p.e=zuf(-4,4);}
    // Scheitel nicht am Rand, Öffnung zeigt ins Bild
    var passt=Math.abs(p.e)<=5 && (p.a>0? p.e<=3 : p.e>=-3 || art==="a") ;
    if(art==="a") passt=true;
    var schl=p.a+"|"+p.d+"|"+p.e;
    i++;
  }while((!passt || schl===vorher || schl==="1|0|0") && i<60);
  vorher=p.a+"|"+p.d+"|"+p.e;
  soll=p; ist={a:1,d:0,e:0}; geprueft=false;
  zeichne(); regler(); gleichung();
  document.getElementById("frage").textContent=S.text;
  var m=document.getElementById("meld"); m.className="meld"; m.innerHTML="";
  document.getElementById("haupt").textContent="Prüfen";
}

// ---------- Zeichnen ----------
var C=document.getElementById("c"), X=C.getContext("2d"), B=840, R=6.5, E=B/(2*R);
function px(x){return B/2+x*E} function py(y){return B/2-y*E}
function parabel(p,farbe,strich,breite){
  X.save(); X.beginPath(); X.rect(0,0,B,B); X.clip();
  X.beginPath(); var erst=true;
  for(var x=-R;x<=R+0.001;x+=0.02){var y=p.a*(x+p.d)*(x+p.d)+p.e; if(Math.abs(y)>R+4){erst=true;continue}
    if(erst){X.moveTo(px(x),py(y));erst=false}else X.lineTo(px(x),py(y));}
  X.strokeStyle=farbe; X.lineWidth=breite; X.setLineDash(strich||[]); X.lineJoin="round"; X.stroke(); X.restore();
}
function zeichne(){
  X.clearRect(0,0,B,B); X.fillStyle="#fff"; X.fillRect(0,0,B,B);
  var i;
  X.lineWidth=1.5; X.strokeStyle="#dbe5ee"; X.beginPath();
  for(i=-6;i<=6;i++){X.moveTo(px(i),0);X.lineTo(px(i),B);X.moveTo(0,py(i));X.lineTo(B,py(i));} X.stroke();
  X.strokeStyle="#18324a"; X.lineWidth=3; X.beginPath();
  X.moveTo(0,py(0));X.lineTo(B-4,py(0));X.moveTo(px(0),B);X.lineTo(px(0),4);X.stroke();
  X.fillStyle="#18324a"; X.beginPath();
  X.moveTo(B,py(0));X.lineTo(B-22,py(0)-10);X.lineTo(B-22,py(0)+10);X.closePath();X.fill(); X.beginPath();
  X.moveTo(px(0),0);X.lineTo(px(0)-10,22);X.lineTo(px(0)+10,22);X.closePath();X.fill();
  X.font="26px system-ui,sans-serif"; X.fillStyle="#4a6278"; X.textAlign="center"; X.textBaseline="top";
  for(i=-6;i<=6;i++){ if(i===0)continue;
    X.beginPath();X.moveTo(px(i),py(0)-7);X.lineTo(px(i),py(0)+7);X.moveTo(px(0)-7,py(i));X.lineTo(px(0)+7,py(i));X.strokeStyle="#18324a";X.lineWidth=2;X.stroke();
    if(i%2===0||Math.abs(i)===1){X.textAlign="center";X.textBaseline="top";X.fillText(String(i).replace("-","−"),px(i),py(0)+12);
      X.textAlign="right";X.textBaseline="middle";X.fillText(String(i).replace("-","−"),px(0)-13,py(i));}
  }
  X.font="italic 30px 'Times New Roman',serif"; X.fillStyle="#18324a"; X.textAlign="right";X.textBaseline="bottom";X.fillText("x",B-8,py(0)-12);
  X.textAlign="left";X.textBaseline="top";X.fillText("y",px(0)+14,6);
  if(geprueft && !gleich()) parabel(ist,"#d9695d",[14,10],4);
  parabel(soll,"#1f6fb2",null,5);
  if(geprueft){ // Scheitel markieren
    X.beginPath();X.arc(px(-soll.d),py(soll.e),9,0,6.3);X.fillStyle="#1f6fb2";X.fill();X.lineWidth=3;X.strokeStyle="#fff";X.stroke();
  }
}

// ---------- Gleichung setzen (Schreibweise der Schule) ----------
function zahl(v){ // Betrag als HTML
  var b=Math.abs(v); if(b===0.5)return bruch(1,2); if(b===0.25)return bruch(1,4); return String(b); }
function bruch(z,n){return '<span class="br"><span>'+z+'</span><span>'+n+'</span></span>'}
function gl(p,name){
  var s='<i>'+(name||"f")+'</i>(<i>x</i>) = ', kern;
  var vor=(p.a<0?"−":"")+(Math.abs(p.a)===1?"":zahl(p.a));
  if(p.d===0) kern=vor+(vor&&Math.abs(p.a)!==1&&Math.abs(p.a)>=1?"":"")+'<i>x</i><sup>2</sup>';
  else kern=vor+'(<i>x</i> '+(p.d>0?"+":"−")+' '+Math.abs(p.d)+')<sup>2</sup>';
  s+=kern; if(p.e!==0) s+=' '+(p.e>0?"+":"−")+' '+Math.abs(p.e);
  return s;
}
function text(p){ // für Vorleser
  return "f von x gleich "+(p.a===1?"":String(p.a).replace(".",",")+" mal ")+(p.d===0?"x Quadrat":"Klammer x "+(p.d>0?"plus ":"minus ")+Math.abs(p.d)+" Klammer zu Quadrat")+(p.e===0?"":(p.e>0?" plus ":" minus ")+Math.abs(p.e));
}
function gleichung(){var g=document.getElementById("gl"); g.innerHTML=gl(ist); g.setAttribute("aria-label",text(ist));}
function gleich(){return ist.a===soll.a&&ist.d===soll.d&&ist.e===soll.e}

// ---------- Regler ----------
function wert(k){var v=ist[k]; if(k==="a"){return (v<0?"−":"")+(Math.abs(v)===0.5?"½":Math.abs(v)===0.25?"¼":Math.abs(v))} return String(v).replace("-","−")}
function regler(){
  var r=document.getElementById("regler"), f=STUFEN[st].frei; r.innerHTML="";
  ["a","d","e"].forEach(function(k){
    var aus=!f[k]?" aus":"";
    r.insertAdjacentHTML("beforeend",'<div class="n'+aus+'">'+k+'</div><button class="'+aus.trim()+'" data-k="'+k+'" data-r="-1" aria-label="'+k+' kleiner">−</button><div class="w'+aus+'" id="w'+k+'">'+wert(k)+'</div><button class="'+aus.trim()+'" data-k="'+k+'" data-r="1" aria-label="'+k+' größer">+</button>');
  });
}
document.getElementById("regler").addEventListener("click",function(ev){
  var b=ev.target.closest("button"); if(!b||geprueft)return;
  var k=b.dataset.k, r=+b.dataset.r;
  if(k==="a"){var i=A_REGLER.indexOf(ist.a)+r; if(i<0||i>=A_REGLER.length)return; ist.a=A_REGLER[i];}
  else{var v=ist[k]+r; if(v<-6||v>6)return; ist[k]=v;}
  document.getElementById("w"+k).textContent=wert(k); gleichung();
});

// ---------- Prüfen und Rückmeldung ----------
function hinweis(){
  var t=[], S="S(" + String(-soll.d).replace("-","−") + " | " + String(soll.e).replace("-","−") + ")";
  if(ist.d===-soll.d && soll.d!==0) t.push("In der Klammer steht <b>d mit umgedrehtem Vorzeichen</b>: Scheitel bei x = "+String(-soll.d).replace("-","−")+" heißt (x "+(soll.d>0?"+":"−")+" "+Math.abs(soll.d)+")².");
  else if(ist.d===soll.e && ist.e===soll.d && soll.d!==soll.e) t.push("<b>d und e vertauscht</b>: d schiebt nach links und rechts, e nach oben und unten.");
  else if(ist.d!==soll.d || ist.e!==soll.e) t.push("Der Scheitel liegt bei <b>"+S+"</b>.");
  if(ist.a!==soll.a){
    if(ist.a===-soll.a) t.push("Sieh auf die <b>Öffnung</b>: nach "+(soll.a<0?"unten heißt Minus":"oben heißt kein Minus")+" vor "+(soll.d===0?"x²":"der Klammer")+".");
    else {var y1=soll.a, y2=soll.a*4;
      t.push("Vom Scheitel <b>1 nach rechts</b>: "+String(Math.abs(y1)).replace(".",",")+" nach "+(soll.a>0?"oben":"unten")+(Number.isInteger(y1)?"":" – oder 2 nach rechts: "+Math.abs(y2)+" nach "+(soll.a>0?"oben":"unten")+", geteilt durch 4")+". Das ist a.");}
  }
  return t.join(" ");
}
function pruefen(){
  geprueft=true; var ok=gleich(), m=document.getElementById("meld");
  verlauf.push(ok); zeichne();
  Signal.blitz(ok);   // Lösung nur auf Wunsch, bei richtig keine (Register 21.11.11)
  if(ok){m.className="meld r"; m.innerHTML="<b>Richtig.</b>";}
  else{m.className="meld f"; m.innerHTML="<b>Noch nicht.</b> Deine Parabel ist rot gestrichelt.";
    Signal.knopf(m,hinweis()+"<br>Gesucht: "+gl(soll));}
  var ende=verlauf.length>=N;
  document.getElementById("haupt").textContent=ende?"Runde auswerten":"Weiter";
  stand();
}
function auswerten(){
  var r=verlauf.filter(Boolean).length, m=document.getElementById("meld"), S=STUFEN[st];
  if(r>=N-1){fertig[S.k]=1; try{localStorage.setItem(LS,JSON.stringify(fertig))}catch(x){} }
  m.className="meld "+(r>=N-1?"r":"f");
  m.innerHTML="<b>"+r+" von "+N+" richtig.</b> "+(r>=N-1?(st<STUFEN.length-1?"Weiter mit der Stufe „"+STUFEN[st+1].name+"“.":"Alle Stufen sitzen."):"Noch eine Runde auf dieser Stufe.");
  if(r>=N-1 && st<STUFEN.length-1) st++;
  verlauf=[]; stufen();
  document.getElementById("haupt").textContent="Nächste Runde"; geprueft="ende";
}
document.getElementById("haupt").addEventListener("click",function(){
  if(geprueft==="ende"){stand();neu();return}
  if(!geprueft){pruefen();return}
  if(verlauf.length>=N){auswerten();stand();return}
  neu();
});
function stand(){
  var p=document.getElementById("punkte"); p.innerHTML="";
  for(var i=0;i<N;i++){var s=document.createElement("span"); if(i<verlauf.length)s.className=verlauf[i]?"r":"f"; p.appendChild(s);}
  document.getElementById("stand").textContent="Aufgabe "+Math.min(verlauf.length+(geprueft?0:1),N)+" von "+N;
}
function stufen(){
  var el=document.getElementById("stufen"); el.innerHTML="";
  STUFEN.forEach(function(S,i){
    var b=document.createElement("button"); b.type="button"; b.setAttribute("aria-pressed",i===st?"true":"false");
    b.innerHTML=S.name+(fertig[S.k]?'<span class="ok" aria-label="geschafft">✓</span>':"");
    b.addEventListener("click",function(){st=i;verlauf=[];stufen();stand();neu();});
    el.appendChild(b);
  });
  var akt=el.children[st]; if(akt&&akt.scrollIntoView)akt.scrollIntoView({block:"nearest",inline:"center"});
}
stufen(); neu(); stand();
})();
</script>
</body></html>
